# Phoenix retrieval-quality view — opt-in OTel collector + UI for
# arXMCP (E14_S03).
#
# Invocation:
#   docker compose -f infra/observability/phoenix-compose.yml \
#     --profile phoenix up -d
#
# Receives OTel spans from the MCP server (E14_S02) on port 4317
# (OTLP/gRPC) and renders them at http://127.0.0.1:6006. The MCP
# server points its exporter at the Phoenix endpoint via
# ``ARXMCP_OTEL_ENDPOINT=http://127.0.0.1:4317``.
#
# Phoenix is permissive-but-not-Apache-2.0 (Elastic License 2.0,
# ELv2). The license is suitable for the project's local-first
# single-workstation use; the runbook
# (.claude/docs/observability-phoenix.md) documents the license
# callout for future contributors.
#
# Security: both Phoenix ports bind to 127.0.0.1 on the HOST. Spans
# carry ``mcp.session_id`` (per
# .claude/notes/08-security-observability-ops.md §Tracing); allowing
# the LAN to scrape OTLP traffic would leak session IDs. The
# loopback binding is the load-bearing defense — do NOT remove the
# ``127.0.0.1:`` prefix.

services:
  phoenix:
    # Minor-version pin (15.10 line) plus content-addressable
    # digest pin. F7/IS3 rectification from the E14_S03 critiques:
    # the tag alone is mutable (Docker Hub allows overwrites of
    # `15.10` with `15.10.1`, `15.10.2`, ...); a compromised
    # builder or malicious upstream push would silently land on
    # the operator's `docker compose pull`. Per
    # .claude/notes/08-security-observability-ops.md §Threat 6,
    # the project pins by SHA wherever possible (model weights;
    # the same discipline applies to Docker images).
    # Multi-arch (amd64 + arm64) — Apple Silicon works without
    # Rosetta. Bump procedure documented in
    # .claude/docs/observability-phoenix.md §"Upgrading Phoenix".
    image: arizephoenix/phoenix:15.10@sha256:34464e86c02f878d76851bd0feb4bba6faead0e842bbea207e08011fa5efcac9

    # Opt-in profile. The default ``docker compose up`` does nothing
    # in this file; only ``--profile phoenix`` materialises the
    # container. Future base ``docker-compose.yml`` will include this
    # file and the same profile gate applies.
    profiles: ["phoenix"]

    environment:
      # OTLP gRPC + HTTP UI ports inside the container. Defaults
      # match the OTLP spec; pinned here for clarity and to keep
      # the host ``ports:`` mapping in sync if Phoenix ever changes
      # its env-var defaults.
      PHOENIX_PORT: "6006"
      PHOENIX_GRPC_PORT: "4317"
      # 0.0.0.0 is correct INSIDE the container — Docker's bridge
      # network forwards the loopback host port-binding to the
      # container's 0.0.0.0 listener. The "localhost-only" defense
      # lives on the host side via the ``ports:`` 127.0.0.1: prefix.
      PHOENIX_HOST: "0.0.0.0"
      # Container path that the bind-mount below maps to
      # ./var/arxmcp/observability/phoenix on the host.
      PHOENIX_WORKING_DIR: "/mnt/data"
      # Bound disk usage. The default ``0`` (infinite) would let
      # the SQLite trace store grow unbounded across long-running
      # debug sessions. 14 days is plenty for retrieval-quality
      # eyeballing on a single workstation.
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "14"
      # Phoenix's own usage telemetry goes to Arize when enabled —
      # explicitly disabled so the ONLY outbound network call is the
      # one-time image pull on first ``docker compose up``.
      PHOENIX_TELEMETRY_ENABLED: "false"

    ports:
      # HTTP UI + OTLP/HTTP (at /v1/traces on the same port).
      - "127.0.0.1:6006:6006"
      # OTLP/gRPC ingest. The MCP server's OTel exporter targets
      # this port.
      - "127.0.0.1:4317:4317"

    volumes:
      # Persistent SQLite trace store. Bind-mount under var/arxmcp
      # so ``make clean`` discipline applies (CLAUDE.md §5: "all
      # state lives under var/arxmcp/"). The host path is created
      # by ``make bootstrap``.
      #
      # CRITICAL — F1 rectification from the E14_S03 adversary
      # critique. Compose v2 resolves relative bind-mount paths
      # against the COMPOSE FILE's directory, NOT the operator's
      # CWD. A bare ``./var/arxmcp/...`` here would land under
      # ``infra/observability/var/arxmcp/...`` (a stray subtree
      # inside ``infra/``), not the gitignored repo-root
      # ``var/arxmcp/`` that ``make bootstrap`` creates. The
      # ``../../`` prefix walks up to the repo root.
      - ../../var/arxmcp/observability/phoenix:/mnt/data

    healthcheck:
      # /healthz on PHOENIX_PORT returns 200 once the Python app is
      # up. ``wget --spider`` is the portable command — Phoenix
      # 15.x images bundle wget but not all bundle curl.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:6006/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      # Phoenix's first-run includes SQLite migration; 20s grace.
      start_period: 20s

    # F3 rectification (E14_S03 adversary critique). The prior
    # value was ``unless-stopped`` — which silently relaunches
    # Phoenix on host reboot. Spans carry ``mcp.session_id`` and
    # Phoenix has no required auth on its trace-read endpoints
    # (Brief 2 §2.2). On a multi-user workstation, a reboot
    # silently reopens the read path. ``no`` matches the "opt-in
    # dev tool" framing — the operator brings Phoenix back up
    # explicitly via ``docker compose up -d`` after a reboot.
    restart: "no"

    # F8 / IS2 rectification — bound the sidecar so a busy
    # retrieval-eval session can't starve the MCP server's
    # BGE-M3 worker or fan up the workstation. 2 GB memory + 2
    # CPUs are conservative starting points; the runbook
    # documents tuning. Compose v2 honours ``mem_limit`` and
    # ``cpus`` outside Swarm mode (the ``deploy.resources``
    # variant is Swarm-only).
    mem_limit: 2g
    cpus: 2.0

    # IS5 rectification — strip default Linux capabilities and
    # block privilege escalation. Phoenix listens on user-space
    # ports (4317, 6006), reads/writes its bind-mount, renders
    # HTTP — none requires any default capability. If the
    # Phoenix entrypoint legitimately needs a capability (e.g.
    # CHOWN to fix ``/mnt/data`` ownership on first run), this
    # will surface on `docker compose up -d` and we'll add the
    # specific cap with ``cap_add:``.
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"

    # IS8 — ensure tini reaps zombies and forwards signals
    # cleanly on ``docker compose down``. Matches the project's
    # ``docker/Dockerfile.server`` precedent (tini as PID 1).
    init: true
