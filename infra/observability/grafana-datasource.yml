# Grafana provisioning — datasource block for the arXMCP dashboard.
#
# Mount at /etc/grafana/provisioning/datasources/arxmcp.yml inside
# the operator's Grafana container; Grafana loads it on startup.
#
# F8 closure (m10 adversary critique): originally shipped as a
# combined `grafana-provisioning.yml` that the operator was
# instructed to "split on the comment markers." That split was
# error-prone and not machine-readable. Now shipped as two physical
# files (this one for datasources, grafana-dashboard-provider.yml
# for the dashboards block) so the operator can mount each at the
# correct provisioning path with no surgery.
#
# IS1 closure (m10 infra-safety critique): when Grafana itself runs
# inside a Docker container (the dominant deployment pattern),
# `localhost:9090` resolves to the Grafana container's own loopback,
# NOT the host running Prometheus. Two common mitigations:
#
#   - Docker Desktop (macOS/Windows): change `url:` to
#     `http://host.docker.internal:9090` (resolves to the host).
#   - Linux Docker with both services in the same compose stack:
#     change to `http://prometheus:9090` (service alias) and the
#     Grafana container needs to be on the same compose network.
#
# The default below works for the host-binary case (Grafana running
# directly on the host) which matches the project's single-operator
# loopback-only posture per CLAUDE.md §4.1.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    uid: prometheus
    jsonData:
      timeInterval: 30s
