schema: roadmap/1
slug: source-truth
project: arxmcp
title: "Source truth — revision registry, spans, license provenance, corpus manifest"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  arXMCP cannot currently promise that a served statement is complete, tied to an exact paper
  revision, or legally servable — and every claim-grain, formal, or computational artifact
  planned downstream inherits those promises. Concretely (all verified at source, 2026-07-11):
  the chunker truncates statements at a 1,920-token budget and sets `truncated` on the
  ChunkRecord (`ingest/chunker.py:679-704`), but `CHUNKS_SCHEMA_V1` has no such column, so the
  flag is silently dropped at write time; chunks carry no source span or document checksum,
  and `corpus_version` is a local MVCC epoch, not a content-addressed snapshot;
  `theorem_label` stores the author's TeX `\label` key with auto-generated IDs nulled
  (`chunker.py:406-418`) — the printed "Lemma 3.2" that citations actually use is never
  extracted, and papers renumber between arXiv versions and journal publication; and the
  license policy allowlists the blanket token `arxiv-license` for full-body serving
  (`server/license_policy.py:44-53`) even though arXiv papers carry heterogeneous real
  licenses (arXiv-perpetual vs CC variants), while the trustworthy-release plan has already
  diagnosed dead textbook license stamping. This initiative makes the corpus reproducible and
  fail-closed at the source layer: an immutable document/revision registry with raw checksums
  and parser/chunker version stamps; exact source spans (DOM anchor + char offsets) on every
  block; truncation persisted and surfaced; printed theorem numbers extracted alongside TeX
  labels; per-revision license provenance fetched from the arXiv API with unknown-fails-closed
  semantics; withdrawal/corrigendum/supersession edges; and a content-addressed corpus
  manifest resource that downstream artifacts pin. Schema changes ride the established
  migration pattern (`ingest/store.py::_migrate_chunks_schema_if_needed`) and batch into
  agent-platform's W1 tool-schema window where tool-visible.
horizon: { start: 2026-07-13, end: 2026-09-11 }
goal:
  hmw: "How might we make every served chunk carry exact revision identity, completeness status, source span, and a real license decision, so that the downstream claim-grain and formal-artifact tracks (R2 identity, R5 provenance) can pin to sources that are reproducible and fail-closed?"
  objective: "Ship the source-truth layer: document/revision registry, span + truncation + printed-number persistence, per-revision license provenance, and a content-addressed corpus manifest."
  key_results:
    - "Every get_chunk response carries a source revision id, a source span or an explicit null (abstention, not silence), truncation status, and a per-revision license decision"
    - "A documents registry row exists for every revision in both live notebooks: work identity, version, raw-source sha256, parse-artifact checksum, parser/chunker versions, fetch timestamp, license URI, and active/withdrawn/superseded status"
    - "Unknown or missing license fails closed to the existing 300-char truncation on a fresh install — zero full-body serving of unknown-license content, including every textbook chunk"
    - "The arxmcp://corpus-manifest resource resolves to a content-addressed snapshot whose checksums re-verify on a clean re-fetch of 3 sample papers"
    - "Backfill hydrates both live notebooks with 0 chunks re-embedded (paper-metadata-m1 precedent)"
    - "Zero regressions: make test stays green including the tools/list schema-hash pin, with new migration, license-decision, and manifest tests added"
  assumptions:
    - tier: must
      text: "The arXiv metadata API returns usable license URIs for the corpus's ID shapes (new-style, old-style, versioned)"
      validation: "spike on a mixed 30-paper sample records per-field coverage; papers with no license URI get license_status=unknown -> truncate, count reported; >20% of the Bridgeland notebook failing closed surfaces to the owner before backfill, with a per-notebook operator override flag (recorded in the manifest) as the documented escape hatch"
    - tier: must
      text: "Printed theorem numbers (e.g. Lemma 3.2) are recoverable from LaTeXML ltx_tag ltx_tag_theorem spans for the dominant paper styles"
      validation: "spike over 20 Bridgeland-notebook papers measures printed-number extraction coverage against a hand count; <80% coverage demotes printed-number matching to one signal among several in R2 rather than the primary key"
    - tier: should
      text: "Span anchoring via (element id, char offsets, normalized-text hash) is stable across LaTeXML re-parses of the same source"
      validation: "re-parse 5 papers and diff anchors; instability moves the anchor to (revision checksum + normalized-text hash) only"
    - tier: should
      text: "The shipped 21-column chunks-schema migration pattern extends cleanly by 5 columns"
      validation: "migration dry-run on a snapshot copy of the live LanceDB dir, riding ingest/store.py::_migrate_chunks_schema_if_needed"
    - tier: should
      text: "trustworthy-release's D8-R04 license-token semantics ruling stays compatible with per-revision license records replacing the blanket arxiv-license token"
      validation: "the fail-closed cutover milestone is owner-gated; the per-notebook override flag recorded in the manifest is the fallback if the ruling diverges"
    - tier: should
      text: "Tool-visible changes (get_chunk response fields, corpus-manifest resource) can batch into agent-platform's W1 tool-schema window"
      validation: "if W1 slips, the manifest ships resources-surface-only (not part of the tools/list hash) and get_chunk field surfacing is sequenced behind W1 at decomposition"
    - tier: might
      text: "The per-notebook SQLite store pattern (paper-metadata-m1, server/paper_metadata_store.py) extends to the documents registry without a new storage engine"
      validation: "registry schema drafted against the existing store at decomposition"
  wont:
    - "No new retrieval features, no ranking changes, no claim IR (that is R2)"
    - "No takedown workflow automation — deletion propagation is designed here as edges + manifest invalidation only; the operational runbook extends docs/ops separately"
    - "No full re-parse of the corpus: spans are computed from the existing parsed HTML; blocks that cannot be re-anchored keep source_span null and are reported as such (abstention, not silence)"
    - "No withdrawal-aware search filtering — retrieval-unlocks owns the search-filter behavior; this track owns the registry and supersession edges"
  evidence:
    - ".claude/roadmap-briefs/R1-source-truth.md — adjudicated planning brief (2026-07-11); all file claims re-verified at source this session"
    - "ingest/chunker.py:679-706 — truncation computed and set on ChunkRecord; STMT_MAX_TOKENS = 1920 at chunker.py:92"
    - "ingest/schema.py — CHUNKS_SCHEMA_V1 has no truncation/span/revision/printed-number/license-ref columns, so the flag is dropped at write time"
    - "ingest/chunker.py:406-418 — _extract_theorem_label returns the TeX label key (auto-IDs -> None); _extract_theorem_name reads only the parenthetical name, so the printed number is never persisted"
    - "server/license_policy.py:44-53 — OA_ALLOWLIST includes the blanket arxiv-license token; mechanism otherwise fail-closed"
    - "ingest/store.py:330 — _migrate_chunks_schema_if_needed, the shipped add-columns migration precedent (textbook-ingest-m2)"
    - "plans/paper-metadata/roadmap.yaml — phase complete; the per-notebook metadata store spine this track extends"
    - "plans/trustworthy-release/roadmap.yaml — D8-R04 owns the license-token semantics decision; dead textbook license stamping diagnosed there"
    - "plans/retrieval-unlocks/roadmap.yaml — withdrawal search-filter behavior lives there; also carries the agent-platform W1 tool-schema-window interlock"
