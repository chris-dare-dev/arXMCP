schema: roadmap/1
slug: evidence-engine
project: arxmcp
title: "Evidence Engine — end the never-measured era"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  arXMCP's retrieval-evaluation machinery is fully built but has never produced a single number: the 20-query fixture at tests/eval/fixtures/queries.json is an empty stub, so make eval has only ever skipped and no nDCG has ever existed, and nothing measures agent behaviour either. This initiative ends the never-measured era. Curate the eval fixture and emit the first harness numbers; land a pinned append-only regression ledger so those numbers are born reproducible; stand up a small agent-task ergonomics eval; and add a zero-labeling auto-benchmark mined from intra-paper reference chains, so that every currently-frozen decision (hybrid re-open, reranker rejection, proof-serving default, embedder swap, session caps, cache ceremony) can finally be settled on the evidence its own gate demands. Fixture curation is irreducibly owner-labeled because LLM grading is barred as circular; grow labels opportunistically rather than via a large campaign. This roadmap OWNS the FIX milestone (eval fixture populated) that several other tracks depend on.
goal:
  hmw: "How might we turn arXMCP's fully-built-but-never-fired eval machinery into real, reproducible numbers so that the maintainer and the sibling roadmap tracks gated on this evidence (retrieval-unlocks, agent-platform, scale-ops-hardening, trustworthy-release) can finally resolve arXMCP's six frozen architecture decisions instead of leaving them paused indefinitely?"
  objective: "Ship arXMCP's first reproducible harness numbers — retrieval nDCG@5/Recall@10, agent-task ergonomics, and a zero-labeling auto-benchmark — behind a pinned regression ledger, ending the project's never-measured era."
  key_results:
    - "`make eval` (dense) records a real nDCG@5/Recall@10 number in `.claude/docs/retrieval-quality-report.md` for the first time, instead of SKIPping."
    - "Every eval run appends a manifest-pinned entry (embedder/chunker/tokenizer/reranker versions + fixture content-hash) to `var/arxmcp/ops/eval/ledger.jsonl`, and watchdog AC1 goes live."
    - "An 8-10 task agent-ergonomics eval reports pass^k, tool-call count, and wrong-tool-selection rate for at least one pre/post milestone comparison, published in the README."
    - "`tools/build_dependency_eval.py` scores Recall@k/MRR under a new eval_auto marker on zero hand-labeled auto-qrels mined from intra-paper `\\ref{}` chains, sliced same- vs cross-section."
    - "At least 3 of the 6 named frozen decisions (hybrid re-open, reranker rejection, proof-serving default, embedder swap, session caps, cache ceremony) carry a recorded verdict — resolved or explicitly still-frozen-with-reason — that cites this roadmap's numbers."
    - "`tools/daily_metrics_report.py --check` reports the Tier-2→3 cache-hit-rate gate's first-ever pass/fail number against a real 24h window."
  assumptions:
    - tier: must
      text: "The owner can complete 20-query graded-relevance labeling within a 1-2 owner-day budget without the FIX milestone slipping again the way verification-feedback-e3 already has since 2026-05-08."
      validation: "A time-boxed dry run labels the first 5 queries and measures actual owner-minutes per query before committing the full budget; if the extrapolated total exceeds ~2 owner-days, cut fixture size to the smallest n that still supports D9-R02's paired-comparison math rather than let the milestone slip again."
    - tier: must
      text: "Re-scanning parsed HTML recovers enough intra-paper `\\ref{}` citing-anchor-to-chunk mappings (persisted nowhere today) to make D9-R15's zero-labeling auto-benchmark viable at meaningful volume."
      validation: "A spike scans an existing HTML-parsed labeled notebook (bridgeland-stability), maps a sample of `\\ref{}` anchors into chunk boundaries, and records the recovered pair count plus a ~50-pair hand-audited label-noise rate before `tools/build_dependency_eval.py` is built out."
    - tier: should
      text: "The 20-query fixture can be curated entirely from notebooks already ingested on this Windows workstation (e.g. bridgeland-stability) without requiring cross-machine var/ sync of the macOS-only shimura-varieties fixture."
      validation: "Milestone kickoff enumerates locally-ingested notebooks before the query set is finalized; if shimura-varieties coverage turns out to be required, fold a var/ sync task into the curation epic instead of redesigning the roadmap."
    - tier: should
      text: "MCP-Universe (SalesforceAIResearch, Apache-2.0) runs as-is against arXMCP's stdio shim for D7-R13's agent-task harness, avoiding a bespoke large-effort build."
      validation: "The agent-task-eval epic's acceptance includes a 1-task smoke test against MCP-Universe before committing the full 8-10 task suite; fallback is a plain Claude agentic loop via the shim, per the rec's own reduced scope."
    - tier: should
      text: "Bounded API spend for the agent-task eval's 3-runs-per-task loop and the cache-economics script stays inside an acceptable solo-maintainer budget."
      validation: "Each harness enforces a hard spend ceiling and stop condition as an acceptance criterion; task and run counts are cut before the ceiling is hit, not after."
    - tier: should
      text: "D9-R03's MIRB internal-anchor slices still run on the ~3-commit, no-release MTEB-fork harness without needing a rewrite."
      validation: "Verify the harness executes end-to-end on one MIRB slice before scheduling the full 2-3 slice run; fallback is raw MIRB dataset downloads scored with arXMCP's own metrics module."
    - tier: might
      text: "D7-R13 and D7-R15 can share one runner and task-curation pass without materially compromising either eval's design."
    - tier: might
      text: "CG8's 2-3 French-source (EGA/SGA-class) queries can ride the opportunistic fixture-growth pass at near-zero marginal labeling cost."
  wont:
    - "No acting on the numbers once produced — flipping the proof-serving default, re-opening hybrid/rerank, or executing an embedder swap belongs to retrieval-unlocks, not this roadmap. This roadmap supplies evidence; it does not spend it."
    - "No scheduled ~80-query (or larger) labeling campaign — fixture growth toward n≈30-50 is opportunistic (real queries once agent traffic exists, auto-pairs from D9-R15), never a dedicated owner-hours campaign."
    - "No LLM-assisted or LLM-judge grading of the eval fixture — .claude/docs/eval-curation.md bars it as circular; every graded label is owner-authored."
