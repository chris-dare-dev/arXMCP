schema: roadmap/1
slug: agent-platform
project: arxmcp
title: "Agent Platform & Protocol — truthful MCP surface, sane budgets, real traffic"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  arXMCP is agent-first infrastructure, but its MCP contract currently lies and its budgets punish the wrong users: frozen tool descriptions promise a cancelled hybrid path and dead resource links, advertised arguments are inert, and 3-search / 4-get_chunk lifetime session caps break every interactive session while providing zero security (the rotate-id bypass is admitted in code). This initiative makes the surface honest, efficient, budget-sane, and spec-current. Re-base session caps as cost-control capability profiles on the built capabilities layer; correct tool descriptions and add input examples in batched tool-schema re-pin windows; add batch chunk fetch and semantic identifiers; register the resource URIs the server already emits; publish a corpus-manifest resource for plan-time discovery; plan and execute the MCP 2026-07-28 stateless-spec migration that deletes the session identity caps and tracing key on; and scope the minimal orchestrator dispatch loop that makes real agent traffic exist at all. This roadmap OWNS the batched tool-schema re-pin window (W1) that other tracks' schema changes ride, and must redesign the caps jointly with the stateless migration so caps are re-keyed once. Do not add OAuth on loopback, dynamic/deferred toolsets, elicitation/sampling, per-index tool splits, a corpus_stats tool, or session-cap id-binding.
horizon: { start: 2026-07-07, end: 2026-09-18 }
goal:
  hmw: "How might we make arXMCP's MCP surface (tool descriptions, budgets, resources, protocol) truthful and spec-current so that Claude agent sessions -- the owner's interactive sessions today, and the sketcher-to-fixer pipeline this roadmap seeds with its first real traffic -- can complete multi-step retrieval tasks without hitting artificial caps or acting on false tool promises?"
  objective: "Ship a truthful, budget-sane, spec-current MCP tool and resource surface for arXMCP, plus the minimal orchestrator loop that puts real agent traffic through it for the first time."
  key_results:
    - "A single interactive session completes at least 30 search_papers calls and 100 get_chunk calls with zero RETRIEVAL_CAP_REACHED rejections (today's lifetime ceiling is 3 and 4, with a documented rotate-id bypass that provides no real security)"
    - "Zero tool descriptions in tools/list assert functionality that is unshipped, cancelled, or reserved-but-inert, confirmed by a description-vs-handler truth audit run at every batched schema re-pin"
    - "get_chunk resolves a batch of at least 20 chunk ids in one call, collapsing the search-then-fetch loop from N+1 round-trips to 2"
    - "Every arxmcp://chunks/<id> URI the server emits resolves via resources/read, and an agent can read one arxmcp://corpus resource to learn per-index presence (graph, equations, FTS5, metadata, lean) instead of discovering it by spending capped tool calls"
    - "search_papers and cite_neighbors rows carry a human-readable paper title, not a bare arXiv id, whenever the metadata store has one hydrated"
    - "At least one full sketcher-to-fixer pipeline session is recorded end to end by a new minimal orchestrator loop -- arXMCP's first real agent traffic, consumable by the evidence-engine track's agent-behavior eval"
    - "The MCP 2026-07-28 coupling inventory names a working, non-session-keyed replacement for all five identified couplings (session caps, tracing, instructions delivery, the SDK pin, byte-stability pins), reviewed and ready to execute the moment Python SDK v2 reaches stable"
  assumptions:
    - tier: must
      text: "A minimal orchestrator dispatch loop that drives one real sketcher-to-fixer pipeline session -- client-side, outside server/, no anthropic SDK at runtime per CLAUDE.md 4.7/4.8 -- is buildable in the external orchestrator repository the boundary ADR mandates (adr-data-plane-boundary.md Decision 2, Option A; repo name/path deferred to data-plane-governance-m2), coordinated by but not contained in this roadmap, without first requiring the Stage-2 worktree merge or a working Lean toolchain"
      validation: "An early milestone spikes a thin client-side loop (router -> role-prefixed turns -> the already-shipped server/orchestrator/model_selector.py policy -> tool calls over the existing shim) against one canned task end-to-end; if it cannot be produced in-scope, this roadmap formally re-dates every trace-gated trigger it would otherwise unblock (D7-R13's agent-task eval, D9-R09, empirical cap-sizing) rather than silently dropping the deliverable"
    - tier: should
      text: "The Stage-2 worktree's capabilities.py per-tool per-session cap-override layer (unmerged, on _worktrees/arx-onmain) merges within this roadmap's horizon and behaves as the gap-analysis chapters describe -- per-session per-tool overrides superseding the hardcoded 3/4 constants, with a legacy-constant fallback -- so D7-R04 is an adopt-and-tune job, not a from-scratch build"
      validation: "D7-R04's milestone opens with a read-only spike against capabilities.py (worktree, or main if merged by then) confirming the override shape before the milestone is sized; if the merge is still undated at sequencing time, D4-R07's env-configurable interim caps ship alone and D7-R04 moves to a later horizon"
    - tier: should
      text: "The seven changes this roadmap batches into the W1 re-pin window (truthful descriptions, input examples, inert-arg cleanup, batch chunk fetch, semantic identifiers, compact wire format, ToolAnnotations) land as one TOOL_SCHEMA_VERSION bump without breaking a live MCP client -- including that adding ToolAnnotations alongside an input-schema change does not trip the wire-shape rejection a real client showed for outputSchema+annotations together"
      validation: "Before declaring W1 done, run the batch against a live Claude Code session, not just the EXPECTED_TOOL_SCHEMA_SHA256/EXPECTED_BP1_SHA256 hash tests, and confirm all 8 tools still register; a rejection splits the bump into two re-pins instead of shipping a broken client experience"
    - tier: should
      text: "The MCP 2026-07-28 spec finalizes close enough to the 2026-05-21 RC (session removal, server/discover, mandatory Mcp-Method/Mcp-Name) and Python SDK v2 reaches stable near its announced target that a migration plan authored now still applies at execution time"
      validation: "The migration milestone re-checks the published spec and SDK release notes immediately before execution starts, not at planning time; if the final spec or SDK slips or reshapes, only the execution milestone re-plans -- the coupling inventory and cap re-key design this roadmap actually delivers stay valid regardless"
    - tier: should
      text: "Provisional per-session cap defaults in the region of 30 search_papers and 100 get_chunk calls, keeping the existing 1000/hr anti-runaway ceiling, are close enough to what the pipeline and the owner's interactive sessions actually need that shipping them now beats waiting on a sibling track's telemetry"
      validation: "This roadmap's own orchestrator loop, once it exists, generates synthetic multi-step task traces that the caps milestone's acceptance test reads to confirm the defaults hold headroom before being declared done; numbers move on evidence, matching the repo's own measure-first culture"
    - tier: might
      text: "Emitting a resolvable arxmcp://chunks/<id> ResourceLink on every search row is safe for the MCP clients this project targets -- none of them auto-download every result link into model context the way some clients are documented to"
      validation: "The resource-registration milestone makes the emit-vs-truncate-only decision deliberately rather than defaulting to always-on; revisit if a client in active use exhibits auto-fetch behavior"
    - tier: might
      text: "ToolAnnotations (readOnlyHint, idempotentHint, openWorldHint) produce observable client-side value for the clients this project actually uses, rather than being silently ignored"
      validation: "None required -- the change is a single-arg registration add already inside the scoped W1 re-pin; harmless if ignored"
  wont:
    - "No OAuth or auth hardening on loopback (D7-X01) -- loopback + Origin-403 is the spec-compliant posture for a non-internet server; the existing --token-env bearer channel already covers multi-profile needs"
    - "No dynamic/deferred tool loading or Tool Search (D7-X02) -- 8 tools at roughly 3K tokens sits far below the ~10-tool/10K-token threshold where deferred loading pays off"
    - "No elicitation or sampling primitives (D7-X03) -- client support is weak and sampling is deprecated in the 2026-07-28 RC"
    - "No splitting search_papers into per-index tools and no exposing BM25/rerank knobs directly (D7-X04) -- the server owns fusion, the agent owns search-space knobs"
    - "No 9th corpus_stats tool (D7-X06) -- that surface is the arxmcp://corpus resource, not a tool"
    - "No session-cap id-binding (D8-R12) -- it protects no confidentiality boundary and does not close its own rotate-id bypass; caps in this roadmap are budget discipline, not security"
    - "No outputSchema advertisement (D7-R02, weakened) -- a live client has dropped all tools from a server sending outputSchema+annotations in a disliked wire shape; revisit post-RC when the SDK lifts outputSchema to full JSON Schema 2020-12"
    - "No retrieval-algorithm, ranking, or corpus-content changes -- hybrid reopen, reranker re-qualification, embedder swap, the proof-column default flip, Stacks Project ingest, citation-context hydration -- that is the retrieval-unlocks track's territory; this roadmap only touches the tool/resource/protocol surface"
    - "No eval-fixture curation or agent-behavior grading, no browser/UI search surface, and no PyPI/registry timing decisions -- those belong to the evidence-engine, researcher-workbench, and trustworthy-release tracks respectively; this roadmap supplies the traffic (the orchestrator loop) and the spec-currency precondition (the MCP migration plan) those tracks consume"
