      validation: "Decomposition schedules the doctrine-ADR item to cover both merge-lands and merge-vetoed branches explicitly; the graph and external-id items keyed on M0 stay in the later lane and are re-checked at sequencing time rather than blocking the now-lane"
    - tier: should
