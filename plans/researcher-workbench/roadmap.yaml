      text: "Vendored KaTeX (or Temml) renders the corpus's real $TeX$ chunk bodies — including per-paper preamble.json-seeded macros — with acceptable visual fidelity and coverage, not just fixture-page TeX"
      validation: "A 1-day spike renders both KaTeX and Temml against a real sample of corpus chunk body_text with seeded macros and records visual-fidelity/coverage results before either is vendored (D3 chapter open question 2)"
    - tier: must
      text: "The Stage-2 worktree's Windows path-containment fix (Path.is_relative_to) can be cherry-picked onto main independently of the full Stage-2 merge, with no other branch-only dependency blocking it"
      validation: "The Windows-fix milestone's acceptance criteria include a preview request on the Windows tier-1 host returning 200 using only main-portable cherry-picks, verified before any wider Stage-2 content is pulled in"
    - tier: must
      text: "A minimal keyboard-grading plus validator-export loop is enough friction-removal to produce an actual owner labeling session — the fixture has sat at 0 queries for two months with owner buy-in already on record, so the blocker may not be purely instrumental"
      validation: "The eval-labeling milestone's acceptance includes a scheduled 1-hour-plus owner labeling session against the shipped instrument within a set window after ship, with resulting query count — not just instrument delivery — as the pass/fail signal (D3 chapter open question 3)"
    - tier: should
