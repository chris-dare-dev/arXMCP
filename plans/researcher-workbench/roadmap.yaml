schema: roadmap/1
slug: researcher-workbench
project: arxmcp
title: "Researcher workbench — search, curate, label, export"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  There is no way for the human operator to search their own arXMCP corpus on either code tree: the MCP path is human-hostile (lifetime search caps) and no UI or CLI search exists, both surfaces show naked arXiv IDs, and chunk views render raw TeX. Yet the operator's attention is the binding resource, and the eval fixture the whole programme depends on needs irreducibly-human labeling. This initiative gives the single researcher a first-class instrument: a search-and-inspect workbench with real math rendering (vendored KaTeX plus native MathML, no SPA or Node build chain), metadata-rich curation from the shipped paper-metadata store, a completed console ops loop, and an eval-labeling mode that converts scarce owner hours into the labels the evidence-engine track needs, with the long-open browser-surface security audit executed as the gate on expanding that surface. It also flows corpus knowledge outward to the researcher's own tools via BibTeX/CSL-JSON and Obsidian-flavored Markdown export with stable content-addressed citation anchors, over the metadata/identity spine. Land the Windows preview fix immediately, because main 404s every document preview on the tier-1 workstation today. Keep researcher-critical surfaces on the loopback htmx console per the doc-placement rule; the search workbench absorbs the theorem-name jump, so no separate command palette. Do not add watch-folder ingest, zbMATH enrichment, Logseq export, or audio/video overviews.
horizon: { start: 2026-07-07, end: 2026-09-04 }
goal:
  hmw: "How might we build a security-gated search-and-inspect workbench with real math rendering on the loopback console so that the single research operator can read and curate their own arXMCP corpus directly, turning scarce reading time into the eval-fixture labels the evidence-engine track needs?"
  objective: "Ship a security-gated /ui/ workbench so the operator can search, read typeset math, curate, and grade their own corpus directly, and export it to their own citation and notes tools."
  key_results:
    - "A document-preview request on the tier-1 Windows workstation returns 200, not a 404, for a notebook with an ingested paper"
    - "The operator runs a corpus search and opens a full chunk body from a browser, making 0 hand-built JSON-RPC calls and touching none of the 3-search / 4-get_chunk lifetime session caps"
    - "Every /ui/ surface that shows chunk or document text renders $TeX$ / MathML as typeset math, not raw markup, verified against real corpus chunks rather than fixture pages"
    - "The papers table and search-result rows show a linked title instead of a naked arXiv ID for every paper with a hydrated metadata row"
    - "The 5 currently curl-only console endpoints (export, health, reconcile, repair-registry, parse-status) are each reachable from a template button or badge"
    - "A labeling session through the workbench produces at least 1 exported, validator-passing graded query in tests/eval/fixtures/queries.json, up from 0 today"
    - "A notebook exports a citeproc-parseable .bib / CSL-JSON pair and an Obsidian note whose content-addressed block anchor is unchanged after a re-ingest of the same paper"
    - "0 new GET or POST console routes from this roadmap ship without passing the issue #9 checklist, including the added Origin/DNS-rebinding axis, for that specific endpoint"
  assumptions:
