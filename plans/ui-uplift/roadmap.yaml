schema: roadmap/1
slug: ui-uplift
project: arxmcp
title: "Operator console UI uplift — give /ui/ an authored visual thesis"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  The arXMCP operator console at /ui/ reads as generic AI-dashboard output. The owner's
  stated diagnosis was "the standard tailwind + shadcn feel" — that diagnosis is factually
  wrong and the perception behind it is correct. There is no Tailwind, no shadcn, no Radix,
  no component library, no Node and no build chain anywhere in this repo (CLAUDE.md 4.7
  forbids them). /ui/ is a hand-authored 371-line stylesheet, three Jinja2 templates and one
  vendored htmx.min.js.

  A 2026-08-03 /frontend-uplift discovery run (5 scouts + an 11-axis adversarial challenger)
  measured the actual causes against a live server. The console scores 6/13 on the
  cookie-cutter rubric — the "generic AI dashboard" band edge — reached without a line of
  shadcn. The measured causes: the dark palette is a self-documented GitHub-Primer clone
  (app.css says so in its own comment and the hexes are GitHub's exact values); seven
  visually identical .card panels carry the whole detail page; there is one effective type
  step (h2->body is 1.10x, so hierarchy is carried by font-weight alone); and the file
  contains zero box-shadow, zero letter-spacing and zero transition declarations.

  This roadmap converts that discovery output into execution. It adopts direction D-1
  "The Ledger Sheet" — retire .card as a primitive, let a graded hairline rule ladder carry
  all structure, make --mono a true data voice on every identifier, and show the corpus
  before the machinery that mutates it. The projected end state scores 2/13 (a pass on the
  anti-pattern half) provided two specific candidates do NOT ship in their tempting form:
  a coloured notebook_kind chip and an ingest state-history strip both push it back to 4-5.
horizon: { start: 2026-08-04, end: 2026-10-31 }
goal:
  hmw: "How might we give the arXMCP operator console an authored visual identity — one legible as research-mathematics infrastructure rather than as any internal tool wearing GitHub's palette — without npm, a build chain, a CDN, a font file, or a widening of the still-open UI security audit?"
  objective: "Replace a borrowed, undifferentiated visual system with an authored one: a single OKLCH material family, a real two-voice type scale, hairline structure in place of the repeated card, and an information architecture that shows the corpus before the six forms that mutate it."
  key_results:
    - "The cookie-cutter score falls from a measured 6/13 to 2/13 on the projected end state, with tell 13 (same-silhouette syndrome) the only remaining 1 — verified per-tell against evidence, not asserted"
    - "Zero colour literals outside the token block: the ~12 hardcoded greys and 8 status-pill literals currently bypassing the 8 CSS variables are folded in, and a full RENDERED-pair contrast table ships as a milestone artifact (not the 8 token-on-ground pairs the design overlay tabulates, which is how two AA failures survived in shipped code)"
    - "Every server-emitted class has a CSS rule, enforced by a test that derives the check from the on-disk tree rather than a hand-maintained list — four class families shipped with no rule at all before this roadmap"
    - "The papers table — the only corpus content on the detail page — is reachable without scrolling past six input forms; it currently begins at y=1823 of a 2343px document"
    - "A screen-reader operator mid-ingest receives announcements on genuine status change only, not every 2 seconds for the run's duration"
    - "Net new vendored frontend files across the whole program: zero or one. Five candidates admitted JS surface at discovery; after adversarial review only the destructive-confirm dialog earns it, and it needs no new file"
  assumptions:
    - tier: must
      text: "The 2022-2026 CSS platform (@container, :has(), :user-invalid, <dialog>, @view-transition, color-mix/OKLCH, text-wrap:balance) delivers, at zero bytes, enough of what Framer Motion / shadcn / Radix provide that this uplift needs no npm dependency and no build chain"
      validation: "Each milestone that cites a platform API states its Baseline status and its fallback at implementation time; a candidate whose API has NOT reached Widely Available ships behind @supports or does not ship. If a required job turns out to have no native expression, that milestone is re-scoped rather than the no-build-chain lock being weakened"
    - tier: must
      text: "The light-mode --border token can be darkened enough to carry structure alone without breaking the palette's character — it computes to 1.342:1 on --bg today, which is fine while borders are incidental and fails SC 1.4.11's 3:1 non-text bar the moment rules become the sole structural device"
      validation: "The rule-ladder milestone cannot start until the material milestone has shipped a darkened rule token that clears 3:1, verified by computation. This is a hard dependency edge, not a preference"
    - tier: should
      text: "An OKLCH re-derivation from a single hue decision can satisfy --accent's five simultaneous roles — button ground (>=4.5:1 vs its own text), focus ring (>=3:1 vs BOTH --bg and --card-bg per SC 1.4.11), link colour, skip-link ground, and badge-flash tint"
      validation: "The material milestone reproduces the reasoning behind the existing hand-patched dark-mode compensation (button colour forced to the canvas value because white-on-accent measured ~3.1:1) rather than inheriting the patch; a derivation that cannot satisfy all five roles splits --accent into two tokens deliberately"
    - tier: should
      text: "Deleting .card as a primitive does not orphan --card-bg, because that token can be re-scoped from panel ground to control ground (inputs, table headers) where three dark-mode rules already depend on it"
      validation: "The rule-ladder milestone states the successor role explicitly in its acceptance criteria; it must also migrate the table-header separation to a rule weight, because th background is 1.14:1 on white today and effectively vanishes once the card ground goes"
    - tier: might
      text: "The information-architecture reorder can move five live htmx swap targets into a native <details> disclosure without breaking hx-target resolution"
      validation: "querySelector resolves hidden nodes, so target resolution is not the risk — the risk is invisible success: the ingest fragment carries hx-trigger every 2s and would poll for a whole run inside a closed disclosure. The milestone renders the disclosure OPEN on any non-terminal ingest state, with a summary state cue"
  wont:
    - "No npm, no Node, no bundler, no CDN, no SPA framework — Tailwind, shadcn, Radix, React/Vue/Svelte, Framer Motion, GSAP, anime.js, cmdk, Sonner, TanStack are all out. Not aesthetic preference: CLAUDE.md 4.7 forbids the build chain and CONTENT_SECURITY_POLICY_UI allow-lists no external script origin, so a CDN tag is blocked at the browser"
    - "No web font. The product ships zero font files and both voices of the type scale are system stacks. Direction D-2 (editorial serif) was the declared runner-up and was rejected specifically because it costs a vendored woff2 — an asset-story change this uplift does not make"
    - "No icons. The console has zero icons today and the frame treats that as an asset (BAN-3). Any milestone that reaches for one — a select dropdown indicator, an empty-state glyph, an ingest status icon — must escalate it as an explicit recorded decision, not drift into it"
    - "No experiential motion — no parallax, scroll-scrub, scroll hijack, WebGL, cursor theater. Every /ui/ route is S-2 tool class; there is no marketing, login, or onboarding surface in this product for such motion to live on"
    - "No JS animation engine. Motion here is CSS transitions plus htmx swap hooks (.htmx-request / .htmx-swapping / .htmx-settling) and native View Transitions. Every motion candidate names one of four jobs — orientation, causality, feedback, continuity — or it does not ship"
    - "No motion on a poll tick. The 2s ingest poll and 10s badge poll may flash on a genuine state CHANGE only"
    - "No charts. No ingest-activity sparkline without a threshold, an annotation and a stated 'so what'; no KPI stat-tile row, which would manufacture metrics the daemon does not have"
    - "No backend or retrieval changes. This roadmap owns app.css, the three Jinja2 templates, and the HTML-fragment builders in server/routes/. Corpus, ingest, MCP tool surface and retrieval belong to other tracks"
    # ---- killed or deferred at the adversarial-challenge phase (discovery ids kept for traceability) ----
    - "KILLED UPL-17-vendored — vendoring the htmx response-targets extension. Billed as 'the safest kind of dependency, it only deletes code', but hx-target-4xx swaps the RAW response body, so the operator would see a JSON error envelope inside pre.error. Behaving as advertised requires changing the 4xx/5xx response contract on seven /ui/api endpoints and moving from textContent to innerHTML semantics. It also contradicts the repo's own recorded decision in VENDORED.md, where json-enc.js was authored in-repo specifically to avoid pinning an unverifiable htmx-extensions version. Survives in zero-dependency in-repo form as milestone ui-uplift-m18"
    - "PARKED UPL-18 — vendoring idiomorph for continuity-preserving swaps. Parked on value, not legality. Names a motion job class but no unserved job: its applicable targets are the four smallest fragments in the product, two of them single-line text swaps, one already carrying a shipped tested settle animation. Puts row-fade-out and badge-flash at regression risk to gain a capability with no named consumer, and a 0-byte alternative (view-transition-name over the already-enabled globalViewTransitions) was never examined. Re-open only when a specific continuity failure is observed AND view-transition-name is shown insufficient for it"
    - "DELETED UPL-19b — the htmx preload extension. Deleted rather than ranked low, because a low rank survives into backlogs and a deletion does not. ~4.5 KB gz plus a third vendored file, a third VENDORED.md entry, a third integrity-test pin and a third security-audit surface, spent to hide network latency on a server that binds 127.0.0.1 and rejects non-loopback at parse time. The problem it solves does not exist in this deployment"
    - "KILLED UPL-24 — the ingest/operability state-history strip. The server does retain ingest history (append-only runs table) but exposes only the latest row, so this needs a new store method, a new route and a new fragment builder before a single pixel changes: a server candidate wearing a frontend candidate's clothes. The operability half has no history at all. It also transplants a fleet-monitoring instrument onto a single-operator loopback cadence, which is the borrowed-shell pattern this whole run exists to remove, and tick meaning available only on hover is an instrument without a reading. Re-file as a server candidate if a decision that depends on run history is ever named"
    - "DEFERRED UPL-25 — an identity strip on the ar5iv preview surface. Unscorable: no paper in the deployment has stored ar5iv HTML, so the route correctly 404s and the surface was never rendered. Worse, that route serves UNTRUSTED third-party HTML under a deliberately tight CSP that permits inline styles, so a trusted identity strip placed inside that document can be restyled, covered or hidden by the untrusted markup — a spoofing surface on the one affordance whose purpose is telling the operator what they are looking at. Also contradicts this run's own surface map, which tags that route 'chrome recedes'. Revisit only with an uploaded fixture, an answer on whether the same-origin favicon already supplies the cue, and an out-of-document delivery decision"
    - "DEFERRED UPL-15b — hover-revealed trailing row actions. Probably superseded by the destructive-confirm dialog (ui-uplift-m14): the rationale for hiding Remove buttons is accidental-click risk, which a real confirm removes at no accessibility cost. If ever revived it must use opacity-based hiding ONLY — display:none or visibility:hidden removes the control from the tab order so the :focus-within guard can never fire, making it permanently keyboard-unreachable and strictly worse than the always-visible buttons it replaces — plus an explicit SC 1.4.13 answer. It is also a pointer-precision regression for motor-impaired and screen-magnifier operators. The row hover TINT shipped separately as ui-uplift-m5 and is unaffected"
  evidence:
    - ".claude/notes/frontend-uplifts/2026q3-ui-uplift/artifacts/final-report.md — the ranked source report: 26 candidates, 5 portfolio lanes, RICE within lane, 6 killed/parked, and the projected per-tell end-state score"
    - ".claude/notes/frontend-uplifts/2026q3-ui-uplift/artifacts/challenge.md — 11-axis adversarial review, 0 BLOCKER / 9 MAJOR / 10 MINOR / 7 NONE; caught three errors in the synthesis including a mis-scoped contrast gate"
    - ".claude/notes/frontend-uplifts/2026q3-ui-uplift/artifacts/synthesis.md — the deduplicated candidate catalog with the adopted design frame in section 0"
    - ".claude/notes/frontend-uplifts/2026q3-ui-uplift/discover/visual-manifest.md — live-measured DOM geometry, computed styles, token set, typography table, htmx inventory and tap-target measurements captured against a running server"
    - ".claude/notes/frontend-uplifts/2026q3-ui-uplift/discover/ — five scout briefs (art-direction, visual, current-state-critic, library, inspiration)"
    - "3a7d626 — fix(server): close 2 WCAG AA failures + 3 UI gaps; the first tranche, already shipped and pushed"
    - "server/frontend/static/app.css — the entire stylesheet; every claim in this roadmap traces to a line in it"
