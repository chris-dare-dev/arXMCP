schema: roadmap/1
slug: windows-distribution
project: arxmcp
title: "arXMCP for Windows — trusted native distribution"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  Build a production Windows distribution in parallel with macOS, reusing the shared desktop/server contract, lifecycle supervisor, MCP endpoint, and /ui/. Give Windows its own packaging, installer, process-tree cleanup, code-signing and SmartScreen trust, clean-host validation, upgrade and data-safety, and support milestones. Materialize epics, executable milestones, spikes, issues, dependencies, labels, native GitHub milestones, and Windows-specific views in the existing arXMCP - Delivery project. Cross-link the macOS program and remove its Windows-only-after-macOS-v1 sequencing constraint without duplicating shared desktop-distribution-m4 work. Resolve platform/version support, installer format, signing provider, ARM64 support, and update channel through explicit roadmap discovery rather than premature assumptions.
horizon: { start: 2026-08-10, end: 2026-11-20 }
goal:
  hmw: "How might we make arXMCP a trustworthy, supportable native Windows application so that a Windows-based research mathematician can install, launch, update, and recover it without managing Python or bypassing Windows security?"
  objective: "Make arXMCP dependable to install, operate, update, and recover on supported Windows hosts while preserving one cross-platform desktop/server contract and the local-first, loopback-only product boundary."
  key_results:
    - "On every declared supported Windows version and architecture, a clean-host release test installs the signed artifact, launches the existing /ui/ and MCP endpoint without Python, Git, a repository checkout, or a terminal, verifies the expected publisher, and needs no instruction to disable or weaken Windows security; any SmartScreen warning and reputation state is measured and documented honestly"
    - "Thirty consecutive Windows launch-to-ready-to-MCP-to-quit cycles plus the forced-failure matrix leave 0 descendant processes, 0 loopback listeners, and 0 startup-capability disclosures after bounded shutdown"
    - "Clean install, version upgrade, interrupted or rejected update, rollback, repair, and uninstall-with-data-preservation scenarios retain 100% of the fixture corpus, notebooks, configuration, and backups unless the operator explicitly chooses deletion"
    - "The shared Rust/Python desktop conformance suite passes byte-for-byte on Windows using the same v1 fixtures, application-data layout, readiness contract, and lifecycle state machine as macOS, with 0 Windows-only protocol forks or duplicate implementations of desktop-distribution-m4"
    - "Before public beta, a published support matrix names the tested Windows versions, architectures, installer and update policy, recovery path, and support boundaries; every supported tuple has a reproducible clean-host evidence record and 0 unresolved CRITICAL or HIGH release findings"
  assumptions:
    - tier: must
      text: "The existing platform-neutral desktop contract and lifecycle state machine can be implemented on Windows with Windows-native process-tree ownership while keeping one wire protocol, one application-data layout, and one shared desktop-distribution-m4 behavior set"
      validation: "windows-distribution-spike-1 builds and runs the locked Rust/Python conformance and lifecycle fault matrix on a clean Windows x64 host, proves descendant teardown through a Job Object with JOB_OBJECT_LIMIT_KILL_ON_JOB_CLOSE or records why that primitive is insufficient, inventories every portability gap, and stops decomposition of the lifecycle lane if a protocol fork would be required"
    - tier: must
      text: "The Python server, native libraries, model-loading path, MCP shim, and /ui/ assets can be packaged into a relocatable Windows application that needs neither the repository nor a pre-existing Python installation"
      validation: "windows-distribution-spike-2 uses a Windows build host (PyInstaller is not treated as a cross-compiler) to produce a disposable frozen runtime, launches it from a read-only application location on a separate clean Windows VM, exercises /readyz, /ui/, one MCP request, and model discovery, and inventories missing binaries, DLLs, writes, and artifact size"
    - tier: must
      text: "A code-signing identity and provider route can be obtained within the program's budget and can produce an installer whose signature, timestamp, publisher identity, and honestly characterized SmartScreen reputation behavior are acceptable on clean supported hosts"
      validation: "windows-distribution-spike-3 compares Microsoft Artifact Signing and viable certificate-provider routes, signs a throwaway artifact without committing credentials, verifies it with Windows-native tooling on clean hosts, records the SmartScreen warning and reputation result without assuming signing suppresses it, records cost, lead time, and renewal path, and gates public beta on owner procurement approval"
    - tier: should
      text: "Windows x64 can serve as a useful first support floor while Windows version breadth and native ARM64 packaging are resolved from clean-host evidence rather than assumed"
      validation: "The support-matrix discovery lane tests candidate Windows versions and x64/ARM64 build and dependency availability; if ARM64 is not release-ready, publish x64-only support with ARM64 explicitly unsupported, and if current supported Windows releases diverge materially, split their release gates"
    - tier: should
      text: "One Windows installer and update strategy can provide signed, operator-comprehensible upgrade and rollback semantics without coupling mutable data to the application directory"
      validation: "The installer-format spike compares Tauri's Windows-built MSI/WiX and NSIS routes, credible Microsoft Store packaging, and WebView2 deployment modes, then exercises install, upgrade, failed update, rollback, repair, and uninstall-preserving-data; if no in-app-safe updater passes, fall back to a signed user-initiated installer plus preflight backup and documented rollback"
    - tier: might
      text: "Automatic background updates or a separate native ARM64 artifact will provide enough near-term user value to justify their additional signing, hosting, test-matrix, and support cost"
      validation: "Revisit at sequencing after the support-matrix, installer, signing, and update-channel spikes report evidence; default to a signed user-initiated x64 release when value is unproven"
  wont:
    - "No Windows-only rewrite of the shared desktop/server protocol, application-data layout, lifecycle state machine, MCP endpoint, or /ui/; Windows owns adapters, packaging, trust, validation, and support"
    - "No duplicate implementation of desktop-distribution-m4; this roadmap consumes the shared lifecycle walking skeleton and adds only Windows-specific process-tree and release evidence"
    - "No dependency on macOS v1 completion before Windows work may begin; only concrete shared-contract milestones form cross-roadmap dependency edges"
    - "No preselection of Microsoft Store versus direct distribution, MSIX, MSI/WiX, NSIS, WebView2 deployment mode, Artifact Signing versus a certificate provider, an update channel, a Windows version floor, or native ARM64 support before the named discovery evidence exists"
    - "No weakening of the single-user, local-first, loopback-only security boundary and no cloud, remote-administration, Windows Server, or managed-enterprise deployment mode"
    - "No SPA or platform-specific operator-console rewrite; the shipped server-rendered /ui/ remains the desktop surface"
    - "No bundling or automatic download of the full research corpus in the installer; corpus acquisition remains an explicit operator action"
  evidence:
    - "plans/desktop-distribution-roadmap.md:25-65 — macOS roadmap establishes the shared cross-platform boundary, production-grade release outcomes, and the prior Windows-only-after-macOS-v1 constraint this roadmap removes"
    - "plans/desktop-distribution-roadmap.md:214-246 — desktop-distribution-m3/m4 define the versioned contract and shared lifecycle walking skeleton that Windows must consume rather than duplicate"
    - "apps/desktop/README.md:3-26 — current production boundary already names Windows x86-64 as a portability target, requires one protocol/data layout, and states that Windows packaging, process control, and signing gates have not landed"
    - "apps/desktop/README.md:50-58,120-136 — the locked cross-language conformance gate, Windows .exe invocation, shared fixture corpus, and model-free sidecar are existing reusable validation substrate"
    - "tests/test_desktop_contract.py:35-67 — Python conformance already includes a Windows-path fixture and Windows executable resolution"
    - ".claude/notes/spikes/desktop-distribution-spike-3.md:3-7,64-80,136-154 — lifecycle GO evidence is macOS/Unix-process-group specific and explicitly does not prove Windows cleanup, production integration, bundling, or signing"
    - "docs/install.md:41-98 — native Windows server and /ui/ operation exists today only as a developer-managed PowerShell/venv flow with degraded POSIX security features and platform test gaps"
    - "tools/desktop_lifecycle_spike/tauri.conf.json:6-12 — the current lifecycle proof intentionally has no application window or active bundle, so it is not a Windows distribution artifact"
    - "AGENTS.md:55,103,255-265 — arXMCP remains a single-user, single-workstation, loopback-only tool provider with operator-gated writes; distribution work may not widen that boundary"
