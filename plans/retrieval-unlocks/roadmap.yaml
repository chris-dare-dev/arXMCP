title: "arXMCP retrieval unlocks — proofs, equations, definitions"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  The highest-ROI retrieval work in arXMCP is unlocking capability that ingest already paid for but serving hides. Proof chunks are embedded and indexed yet hard-excluded from search; the tree-edit-distance equation lane, the flagship math-native differentiator, is bypassed for the LaTeX input agents actually emit; definition-kind filtering, richer citation context, and canonical reference corpora such as the Stacks Project are within reach. This initiative serves what is already built: statement-proof linkage, an opt-in proof-column retrieval path, LaTeX-to-MathML equation input routed onto the existing TED fusion, a definition filter, withdrawal-aware corpus hygiene, and Stacks Project grounding, then makes evidence-gated quality upgrades (contextual chunk prefixes, reranker re-qualification, embedder bake-off) ONLY where the eval numbers show headroom. Schema-touching changes must batch into a single tool-schema re-pin window owned by the agent-platform track; the proof default-flip and all reranker/embedder decisions are gated on the evidence-engine track's first numbers. Do not ingest Mathlib (compose with LeanExplore); no SPLADE, semantic chunking, Matryoshka truncation, or GraphRAG/RAPTOR.
goal:
  hmw: "How might we unlock retrieval capability arXMCP's ingest pipeline already paid for — proof chunks, LaTeX-routed equation search, definition filtering, richer citation context, and Stacks Project grounding — so that the sketcher/autoformalizer/tactician/fixer proving pipeline can retrieve the proof techniques, formulas, definitions, and canonical references it needs today, while quality-sensitive upgrades wait on the evidence-engine's measured numbers?"
  objective: "Ship the retrieval unlocks — proof-chunk retrievability, LaTeX-routed TED equation search, definition filtering, S2-hydrated citation context, and Stacks Project grounding — batched into one agent-platform schema re-pin window, with every quality-sensitive upgrade (prefixes, reranker, embedder) held behind the evidence-engine track's fixture evidence."
  key_results:
    - "get_chunk(include_referenced=True) on a stmt-kind chunk returns its paired proof window(s) via (paper_id, theorem_label, kind='proof') linkage, with a documented section_path/adjacency fallback when theorem_label is null"
    - "find_equation resolves LaTeX-form queries onto the TED+dense fusion path (retrieval_mode reports something other than dense_only_stmt_fallback) instead of always bypassing to dense-only"
    - "search_papers accepts filters={'include_kinds':['proof']} and returns proof-kind rows with honest excluded_kinds/retrieval_mode fields; the dual-column-RRF default stays OFF until the evidence-engine fixture verdict lands"
    - "search_papers's kind=definition filter returns 0 non-definition rows when set, reusing the shipped SUPPORTED_FILTER_KEYS predicate builder with no re-ingest or re-embed"
    - "cite_neighbors edges hydrated from Semantic Scholar carry a non-null citation-context snippet on the workstation's backfilled citation graph"
    - "The Stacks Project is ingested as a textbook:stacks-project notebook with theorem_label populated from the published tags file for at least one chapter, license stamped GFDL"
    - "get_paper/search_papers default-exclude withdrawn papers with include_withdrawn=true as the documented escape hatch, built on the live dense filter path rather than the unwired BM25 module"
    - "0 default-path reranker, embedder, or contextual-prefix changes merge before the evidence-engine track publishes its first fixture nDCG@5 number"
