    - tier: must
      text: "The interactive session-cap fix (D4-R07 env-configurable caps, owned by the agent-platform roadmap, not this one) lands before this roadmap's PyPI-publish step executes — the brief is explicit that a broken first run is fatal"
      validation: "the release milestone gates on a green D4-R07/D7-R04 acceptance signal (an interactive session survives more than 3 search_papers calls) from the agent-platform roadmap before D4-R01's PyPI-publish sub-step runs; if it slips, this roadmap ships only the wheel fix + doc corrections and holds publish"
    - tier: must
