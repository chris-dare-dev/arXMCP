      validation: "the release milestone gates the PyPI-publish sub-step on R1's Release-gate exit signal in addition to the D4-R07/D7-R04 session-cap signal; if R1 slips or is vetoed in this disposition wave, this roadmap ships only the wheel fix + doc corrections and holds publish, exactly as it already does for a slipped session-cap fix"
