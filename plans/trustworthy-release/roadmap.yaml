schema: roadmap/1
slug: trustworthy-release
project: arxmcp
title: "arXMCP — trustworthy release & adoption"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
horizon: { start: 2026-07-07, end: 2026-10-07 }
brief: |
  arXMCP is unusually well-tested but not safe to install or cite. The Python wheel omits frontend assets so a standalone install crashes, there is no PyPI or MCP-registry presence, a fresh install hits the retrieval cap within minutes, and two code-confirmed trust defects sit in the tree: the integration branch emits unfenced author-controlled paper metadata with a guard test whose polarity is inverted so the bug ships green, and textbook license stamping is dead so copyrighted PDFs serve full-body under an open-access default. This initiative makes the project installable, honest, and safe to cite. Fence the two defects; complete the half-executed v0.1.0 release (fix the wheel, publish to PyPI with a one-command quickstart, cut the GitHub Release, since the tag already exists); correct the one false public security claim; ship a citation contract with client-side quote verification; publish a reproducible benchmark page anchored to REAL numbers once the evidence-engine track produces them; then run the adoption experiment (registries, a demo, a license-clean reference pack, CITATION.cff) under a one-quarter falsifiability clock, re-scoping distribution to personal utility if a pip-installable, registry-listed arXMCP draws no adopters in a quarter. Never publish before the session-cap fix (a broken first-run is fatal) or a benchmark before real numbers exist. Compose with LeanExplore rather than ingesting Mathlib. Do not pursue trusted-group deployment or re-tag v0.1.0 (it exists).
goal:
  hmw: "How might we fence arXMCP's known trust defects and finish its half-executed release so that a prospective researcher-adopter can `pip install` it in one command, trust what it serves and cites, and get an honest one-quarter verdict on whether it's worth adopting?"
  objective: "Ship a PyPI-installable v0.1.0 that is safe to install and safe to cite, then let a one-quarter adoption verdict decide whether to keep investing in distribution."
  key_results:
    - "A clean-environment `pipx install arxmcp` / `uvx arxmcp` boots the server (frontend assets present in the wheel) with 0 standalone-install crashes"
    - "The get_paper wrap-helper tripwire test asserts wrapping IS applied to title/abstract and fails the moment wrapping is removed — the inverted-polarity guard (D8-R02) is corrected"
    - "100% of source_kind=textbook chunks carry a non-OA-allowlisted license token by default, and get_chunk visibly truncates a re-ingested copyrighted textbook body under the existing 300-char policy"
    - "SECURITY.md's model-loading invariant row states the true pickle/safetensors split, with 0 false claims"
    - "The citation contract in .claude/docs/ defines (chunk_id, corpus_version, char_start, char_end, quote_sha256), and a worked example demonstrates a client-side re-slice of a real get_chunk body reproducing the pinned hash"
    - "docs/evaluation.md publishes 0 numbers that don't trace to a completed evidence-engine fixture run"
    - "At the one-quarter mark after PyPI + registry listing, an owner decision record exists: a measured adopter count, or an explicit re-scope-to-personal-utility call"
  assumptions:
    - tier: must
      text: "Including frontend/ templates+static in the wheel (pyproject.toml:20's include list) is the ONLY missing piece for a standalone `pipx install arxmcp` boot — no other runtime-required file or dir is wheel-omitted"
