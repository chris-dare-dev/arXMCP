schema: roadmap/1
slug: data-plane-governance
project: arxmcp
title: "Data-plane governance — boundary ADR, plan dispositions, trust language"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  arXMCP's identity as a read-only proof-discovery data plane is currently conventional, not
  structural: six of the seven plan directories are untracked working files (only
  `plans/paper-metadata/roadmap.yaml` is committed), the untracked agent-platform plan scopes a
  client-side orchestrator dispatch loop inside this repo, agent-facing trust language is
  undefined (the `lean_verify` tool returns `status: "ok"` for anything that elaborates without
  errors or sorries), and market/novelty claims in analysis documents are phrased categorically
  ("nobody ships X") rather than as scoped censuses. This initiative writes the constitution
  before the construction: a data-plane boundary ADR (server = evidence and verified artifacts
  only; agents, run memory, and model policy live outside; writes are offline/operator-gated);
  an owner decision committing, revising, or vetoing each of the six untracked plan tracks; a
  trust-language policy banning any single "verified" status in favor of multi-axis trust
  records; an abstention policy making "unknown / ambiguous / unsupported" first-class tool
  outcomes; and an evidence-ledger standard for novelty claims (dated, scoped, query-listed).
  Do not build any new server capability in this track — it produces ADRs, policy docs, and
  git-state decisions only.
horizon: { start: 2026-07-11, end: 2026-07-25 }
goal:
  hmw: "How might we make arXMCP's data-plane boundary, trust vocabulary, and plan-tracking state explicit and binding so that every subsequent track (R1-R7) inherits decided policy instead of re-litigating it?"
  objective: "Ship the four governing documents plus the six-plan disposition decision, each short, owner-approved, and referenced from CLAUDE.md."
  key_results:
    - "The orchestrator-loop placement question is closed: the boundary ADR at .claude/docs/adr-data-plane-boundary.md records the three boundary rules (no agent dispatch or per-run agent memory in the server; writes only via offline ingest or operator-gated console actions; orchestrator loop either moved to a separate repo or re-scoped as a client-side tool under tools/ with zero server-side state), and the agent-platform plan is amended to match the recorded choice"
    - "git status plans/ shows zero untracked pre-existing plan tracks: each of the six (agent-platform, evidence-engine, researcher-workbench, retrieval-unlocks, scale-ops-hardening, trustworthy-release) carries a recorded owner disposition — committed, revised-then-committed, or vetoed-and-archived"
    - "No bare trust status survives on paper: the trust-language policy at .claude/docs/trust-language-policy.md bans any single verified-style enum on the MCP surface, defines the multi-axis trust-record dimensions and the abstention outcomes (unknown / ambiguous / not-in-corpus / unsupported-by-provider) every tool must be able to return, and the R3/R5 briefs' tool-surface gates reference it"
    - "Every 'no system does X' novelty claim cited in the R0-R7 briefs carries a dated, scoped census (census set + queries + date) per the evidence-ledger standard"
    - "CLAUDE.md carries the boundary + trust-language rules as binding agent constraints, so every future agent session inherits them at session load"
  assumptions:
    - tier: must
      text: "The owner will actually disposition the six pre-existing untracked plan tracks in one sitting"
      validation: "m2 acceptance is the git state itself: all six tracks show a recorded disposition (committed, revised-then-committed, or vetoed-and-archived); if the owner defers any, those tracks stay formally 'proposed' and R2+ briefs treat their contents as suggestions, not commitments"
    - tier: should
      text: "Moving the orchestrator loop out of this repo does not orphan the model-policy code in server/orchestrator/ — it can remain a library consumed by the external client"
      validation: "m1 acceptance requires the ADR to name the disposition of server/orchestrator/model_selector.py explicitly"
    - tier: should
      text: "The stability-mflds rigor.py Rigor/Certificate lattice is a suitable base vocabulary for the multi-axis trust record — aligning with it beats inventing a competing lattice"
      validation: "m3 drafting includes an alignment pass mapping each trust axis onto rigor.py's lattice and recording any divergence in the policy doc"
    - tier: might
      text: "CLAUDE.md has no 'Hard constraints' section today (README.md:135 holds the operator-facing one), so the amendment lands as a new section or extends section 4 working conventions"
      validation: "m1 records the chosen CLAUDE.md anchor"
    - tier: might
      text: "Retroactive evidence-ledger application is bounded to the novelty claims actually cited in the R0-R7 briefs, not every historical analysis doc"
      validation: "m3 scopes the retro pass to brief-cited claims"
  wont:
    - "No code changes to server/ — this track produces ADRs, policy docs, and git-state decisions only"
    - "No tool renames and no lean_verify surface changes — R3 owns the verification-contract surface"
    - "No TheoremGraph/Matlas licensing decisions — R7 owns adapters; only the general principle lands here (non-commercially-licensed external data stays in a candidate layer and is never redistributed)"
    - "No enforcement tooling for the new policies (no CI linters, no schema validators) — adoption is by reference from CLAUDE.md; enforcement lands with the consuming tracks"
  evidence:
    - ".claude/roadmap-briefs/R0-data-plane-governance.md — adjudicated planning brief (2026-07-11) this roadmap adapts"
    - ".claude/roadmap-briefs/README.md — R0-R7 dependency order; no R-track ships a tool-surface change until m1 + m3 merge"
    - "git status plans/ (re-verified 2026-07-11) — only plans/paper-metadata/roadmap.yaml tracked; the six untracked tracks match the brief exactly (data-plane-governance/ and source-truth/ are newer R-track scaffolds outside disposition scope)"
    - "server/handlers/lean_verify.py:290-298 (re-verified 2026-07-11) — status 'ok' iff no error-severity messages and no sorry goals; the bare-status trust gap this policy closes"
    - "plans/agent-platform/roadmap.yaml:23,120 — orchestrator loop specified 'client-side, outside server/', boundary-compatible but structurally unenforced; model_selector.py referenced only by tests"
    - "README.md:135 '## Hard constraints' — existing operator-facing constraints section; CLAUDE.md has no equivalent header yet"
    - "stability-mflds rigor.py — existing Rigor/Certificate lattice to align the trust vocabulary with (external repo, per the adjudicated brief)"
    - "plans/paper-metadata/roadmap.yaml — the one committed roadmap/1 precedent for house style and committed-plan state"
