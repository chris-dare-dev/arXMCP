title: "Lean verification contract — honest five-operation trust surface"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  `lean_verify` is a useful feedback hook and an unsound trust surface. Verified at source (2026-07-11): the handler maps "no error messages and no sorries" to `status: "ok"` (`server/handlers/lean_verify.py:290-298`) with no comparison of the candidate against an expected target signature, no rejection of target replacement or declaration-kind changes, no transitive axiom enumeration (a bare `axiom h : False` passes silently and poisons everything after it), no unsafe/metaprogramming policy, and no independent replay; `syntax_only` is not syntax-only — terms are `#check`-wrapped (full elaboration) and declarations run under a 5,000-heartbeat cap that reduces but does not remove kernel work (`lean_verify.py:367-396`; mitigating: the handler already returns `compilation_success=null` for syntax_only passes). The live environment is a core-only REPL that cannot import Mathlib or BridgelandStability (verification spike: "No mathlib build was required"), the flag defaults off, and on Windows the only resource control is the 30 s wall-clock (`server/lean_repl.py` — RLIMIT path is POSIX-only; the repo's own sandbox design doc names filesystem/memory/FFI/network as open risks). This initiative replaces the single mode with an honest five-operation contract — `parse_source` (parser only), `elaborate_signature` (server-supplied expected signature; unsolved metavariables rejected), `check_declaration` (isolated environment compile), `audit_axioms` (transitive closure vs the allowlist propext / Quot.sound / Classical.choice), `strict_replay_proof` (fresh independent checker; exact target/signature equality; SafeVerify-pattern) — behind real OS isolation on Windows (Job Object + restricted token, or container/WSL2 boundary: read-only environment, per-call scratch, no network, CPU/memory/process/file-size limits, teardown on violation), validated by an adversarial attack suite whose required false-accept rate is zero. It adds named immutable environments (core; mathlib@commit; bridgeland-anchor@commit) with an `arxmcp://lean-env` manifest resource and a reproducible build smoke, and — only after the gates — content-addressed result caching keyed on (candidate hash, target hash, ordered imports, environment digest, checker + trust-policy version, compiler options, resource policy), with positive strict results durable and timeouts/memory failures cached briefly or not at all. Warm pooled workers with REPL incremental state reuse come last, inside the same boundary. Until the contract lands, trust-bearing labels are disabled: `status: "ok"` is renamed to what it is (`elaborated_no_errors`), and the trust-language policy (`.claude/docs/trust-language-policy.md`) governs the response schema. Existing prior art is adopted, not rebuilt: SafeVerify for kernel-bypass patterns, AXLE's per-request environment selection as the shape of named envs, Kimina/Poiroux pooling + state reuse (~8 s -> ~0.02 s Mathlib-import round-trips) for the performance tail.
goal:
  hmw: "How might we make every Lean-derived signal arXMCP serves impossible to misread — parse vs elaborate vs check vs axiom-audited vs strictly-replayed, in a named immutable environment, under real isolation — before any formal artifact ships?"
  objective: "Ship the five-operation Lean verification contract, the isolation boundary, the zero-false-accept attack suite, named environments with manifests, then caching and pools."
  key_results:
    - "The MCP surface exposes the five operations (parse_source, elaborate_signature, check_declaration, audit_axioms, strict_replay_proof; naming/registration batched into W1), with lean_verify kept as a deprecated alias returning the honest renamed statuses."
    - "elaborate_signature and strict_replay_proof take a server-side target reference (R5 registry id or inline expected signature); candidates that rename, re-kind, strengthen, or weaken the target are rejected with a specific error."
    - "audit_axioms returns the exact transitive axiom set and an allowlist verdict; any non-allowlisted axiom, unsafe/partial declaration, or environment-mutating construct fails the trust verdict."
    - "The adversarial suite runs in CI-equivalent local gating with zero false accepts across sorry, custom axiom (direct + via import), target replacement, kind change, strengthening/weakening, unsafe, metaprogramming/IO/filesystem attempts, native_decide-under-forbidding-policy, declaration shadowing, cross-request leakage probes, and heartbeat/memory/fork bombs (all fail closed as resource errors, never as acceptance)."
    - "Untrusted Lean executes inside a measured OS boundary on Windows (Job Object + restricted token, or container/WSL2 — spiked and recorded as an ADR): no network, read-only toolchain/env, writable per-call scratch only, memory/CPU/wall/process caps, kill-and-teardown on violation; corpus and user home are unreachable."
    - "Named environments (core@<lean-ver>, mathlib@<commit>, bridgeland-anchor@<commit>) exist with reproducible builds; the arxmcp://lean-env resource returns toolchain, commits, lake manifest hash, import universe, checker + policy versions, and environment digest; a build-smoke script reproduces each digest from scratch."
    - "Result cache is content-addressed on the full key (candidate hash, target hash, ordered imports, environment digest, checker + trust-policy version, compiler options, resource policy) with hit/miss metrics on /metrics; positive strict results are durable across restarts, timeout/memory outcomes TTL <= 1h."
    - "Pooled warm workers (per named environment) with incremental state reuse hit a measured p50 < 1s for repeat verification in the mathlib env — gated on the prior two key results — and bound the live REPL environment-snapshot tree (inherited F7) by recycling workers on a snapshot-count/age budget, consuming the live-snapshot/worker-age gauge already shipped standalone in lean-repl-observability-m1."
  assumptions:
    - tier: must
      text: "A Windows isolation boundary with the required properties (no network, read-only toolchain, per-call scratch, CPU/memory/process/file-size caps, kill-and-teardown) is achievable at acceptable overhead via Job Objects + restricted token, or Docker/WSL2 (which scale-ops-hardening already plans for MinerU)."
      validation: "A 3-day spike measures both routes against the attack suite's resource cases; if neither meets the bar, Lean stays disabled-by-default and R5 targets are checked via a documented manual operator workflow, not served live."
    - tier: must
      text: "A strict independent replay path exists for the pinned toolchain (SafeVerify supports version branches; fallback: fresh-environment re-elaboration with axiom audit in a second process)."
      validation: "Replay catches 100% of the attack suite's kernel-bypass cases; if SafeVerify lacks the pinned version, the fallback is measured against the same suite before acceptance."
    - tier: should
      text: "mathlib@pinned-commit builds reproducibly on this workstation (disk/RAM budget ~tens of GB / >=16 GB)."
      validation: "Build smoke with `lake exe cache get` timed and recorded in the environment manifest doc."
    - tier: should
      text: "Incremental REPL state reuse (prefix caching) composes with the isolation boundary without cross-request leakage."
      validation: "Leakage probes run against the pooled configuration specifically; failure keeps pools per-request-fresh (slower, safe fallback)."
  wont:
    - "No proving, no tactic search, no premise selection (compose with LeanExplore/LeanSearch externally; R7 adapters)."
    - "No claim that kernel acceptance equals paper fidelity (that axis belongs to R5's human review dimension)."
    - "No multi-user tenancy; loopback-only stands."
    - "No Mathlib ingestion."
  evidence:
    - "server/handlers/lean_verify.py:717-733 — status=\"ok\" <=> no error-severity messages AND no sorries, an elaboration-only verdict (line numbers re-verified 2026-08-03; shifted from the brief's original 290-298 after the axiom_audit block was inserted)."
    - "server/handlers/lean_verify.py:1007-1027,1186 — syntax_only wraps terms in `#check (...)` / `set_option maxHeartbeats 5000 in` (full elaboration; the heartbeat cap reduces but does not remove kernel work; shifted from the brief's original 367-396)."
    - "server/handlers/lean_verify.py:359-398 — the axiom-hygiene axis (axiom_audit, AXIOM_ALLOWLIST) now ships (issues #205/#281/#332, TOOL_SCHEMA_VERSION 21->22, verified 2026-08-03): the founding status=\"ok\" conflation is PARTIALLY closed. The five-operation split, target binding, OS isolation, attack suite, named environments, caching, and pools remain unbuilt — this track is not smaller for the closure."
    - "server/lean_repl.py:44-224 — Windows has no RLIMIT_AS analogue; preexec_fn resource caps are POSIX-only; wall-clock timeout is the only Windows control today."
    - ".claude/notes/spikes/verification-feedback-spike-2.md — core-only REPL, no mathlib build required, sub-second round-trips."
    - ".claude/docs/lean-sandbox-design.md — self-documented open risks (elaboration is Turing-complete; FS/memory/FFI/network) and § \"Environment-snapshot accumulation (F7)\"."
    - "CLAUDE.md §4.9 — the trust-language + evidence-ledger policy this track's response schema must conform to."
    - "plans/data-plane-governance/roadmap.yaml (phase: complete) — R0, this track's dependency, SHIPPED."
    - ".claude/roadmap/lean-repl-observability.md — F7's read-only telemetry half SHIPPED standalone (lean-repl-observability-m1, ahead of the trust gate); this track's m7 consumes/extends its gauges and retains only env-tree bounding (recycling + pickle-migration)."
    - "SafeVerify (github.com/GasStationManager/SafeVerify); AXLE (arXiv:2606.26442) named-env + strict-check shape; Poiroux REPL state reuse (~8s -> ~0.02s) and Kimina pooling (arXiv:2504.21230) for the performance tail."
