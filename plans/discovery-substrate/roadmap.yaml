schema: roadmap/1
slug: discovery-substrate
project: arxmcp
title: "Discovery substrate — mine the corpus's negatives, and refute before proving"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  arXMCP is a high-fidelity mathematical reading surface with no representation of a negative result in any of the three directions: it cannot retrieve the literature's own negatives (necessity, sharpness, converse-fails, open, counterexample-pointer sentences are prose, and search_papers is dense ANN over BGE-M3 statement embeddings which ranks mathematical topic and is blind to epistemic stance); it cannot compute one; and it cannot store one. Read down the discovery loop -- notice, locate the frontier, understand hypothesis usage, reduce, construct a candidate, test/falsify, record -- and arXMCP is served at exactly one stage (verify), partial at two, and absent at five, plus two whole unserved modalities (diagrams, cross-paper notation). Every live roadmap improves stage 3 and the retrieval feeding stage 1; nothing in the current plan touches the rest. This roadmap builds the un-gated half: the shared mining substrate that nine separate proposals each silently assumed exists, the miners that ride it as data files, and the fidelity debt where ingest already paid for signal that serving discards. It also builds the Lean refutation lane — the compute-a-negative direction — accepting that it gates on R3's honest statuses, isolation, and warm Mathlib-resident environment, recorded here as must-tier assumptions rather than assumed away. It deliberately excludes the durable-negative census and attempt ledger, which gate on an orchestrator repo that does not exist yet, and the object axis, which gates on a density measurement.
goal:
  hmw: "How might we build one span-addressed mining substrate over already-parsed LaTeXML prose, so that every negative signal the corpus already contains ships as a versioned lexicon with a measured precision number, instead of nine incompatible half-builds and a labeling campaign the owner-hours budget forbids?"
  objective: "Give arXMCP a representation of the negative in two of its three directions — retrieve the literature's own recorded negatives from a shared, precision-measured mining substrate, and compute one through a Lean refutation lane that returns a kernel-checked witness — while paying the fidelity debt where ingest already produced signal that serving discards."
  key_results:
    - "A stratified hand-scored sample of the first lexicon (boundary markers) reports a per-class precision number and a coverage denominator as a dated record in the evidence-ledger 5-field census format — before any further lexicon is funded."
    - "A query whose intent is epistemic stance rather than topic (`is the normality hypothesis necessary here`) returns the sentence `normality cannot be omitted, as Example 5.3 shows` via a marker class, where dense ANN over `embedding_stmt` today returns only topically-similar theorems."
    - "`lean_verify` returns a kernel-checked refutation witness for a false finite statement under a status token distinct from both proved and error, with `plausible` (installed at the repl packages dir, unreachable today) on the path."
    - "Every Lean result carries library identity (toolchain + Mathlib revision); a grep for `mathlib_rev`/`toolchain`/`lean_version` over the handler returns 0 today."
    - "`ascii_form` is populated for a measured fraction of the equations table with the unconvertible fraction reported honestly, replacing the unconditional empty string written at both call sites (`ingest/extract_equations.py:195,264`)."
    - "A corpus-wide symbol view reports the divergent-macro classes measured at 661 of 3,429 distinct symbols (19.3%), where `get_definitions` today requires a `paper_id` and cannot answer a cross-paper question at all."
  assumptions:
    - tier: must
      text: "Sentence segmentation over research-mathematics prose (display math mid-sentence, enumerated hypotheses, closed abbreviations) is tractable enough that a curated regex lexicon clears a usable precision bar on a stratified sample."
      validation: "spike-1 authors exactly ONE lexicon (boundary markers) against the substrate and hand-scores 50 matches; if per-class precision does not clear the recorded bar, the remaining lexicons are not funded and the roadmap ships the fidelity-debt epic alone."
    - tier: must
      text: "A warm Mathlib-resident Lean environment (owned by R3-m5/m7, nobody's deliverable in this roadmap) lands before the refutation lane ships; the known residual is that the 30 s query timeout is shorter than a cold `import Mathlib`."
      validation: "the refutation milestone's acceptance records a measured cold-vs-warm import timing; until the warm env exists the lane's milestones stay in the Next lane and are never promoted to Now on schedule pressure alone."
    - tier: must
      text: "R3-m1 (honest per-axis statuses) and R3-m2 (isolation) land before any agent-supplied long-running search is exposed, since a refutation mode invites exactly that traffic."
      validation: "the refutation milestone declares depends_on against them and its acceptance asserts isolation is in place before the mode is reachable."
    - tier: should
      text: "The `equations` table can be materialized at all — `ingest/index_equations.py` appears never to have been run on this workstation, so `ascii_form` may populate a column nothing reads."
      validation: "spike-3 materializes the equations table on one notebook and measures Content-MathML to CAS convertibility before the ascii-form work is scoped."
    - tier: should
      text: "The 1,483 inline `<svg>` figures across 120 of 173 papers are TikZ/tikz-cd renderings usable as served artifacts rather than raster images."
      validation: "spike-2 samples ~30 figures for asset-kind distribution; a raster-dominant result reduces the figure epic from a modality lane to caption-and-reference indexing."
    - tier: might
      text: "arXiv `<comments>` on revisions carry enough statement-change signal to justify a statement-level diff beyond the cheap comment parse."
  wont:
    - "No durable attempt-ledger or negative-result memory — it gates on an orchestrator repo that does not exist yet, and per the data-plane ADR the server may never hold per-run agent memory. The census record type belongs with it, not here."
    - "No object axis, object-family registry, or enumerator surface — gates on a Wave-0 density scan and belongs to R7-KR1's adapter layer."
    - "No statement graph, goal-shaped retrieval, or ingest-frontier ranking — gates on evidence-engine-e4's intra-paper extractor and R2-m3's precision gate."
    - "No LLM anywhere at ingest — cross-synthesis §5 items 10-12 ban it; every miner in this roadmap is deterministic regex plus suppression guards, and abstains rather than guesses."
    - "No generic multi-engine CAS tool with agent-supplied programs — R4-verified-computation already adjudicated this design space in the opposite direction (named, oracle-checked operations with replayable receipts)."
    - "No second census schema — the evidence-ledger standard is Accepted (2026-07-12) and already carries a 5-field template; extend it with a claim class, never fork it."
    - "No complement view (`theorems with no recorded necessity witness`) until the miner's precision is measured — an unmeasured complement manufactures false confidence, which is the most expensive error class here."
  evidence:
    - "The 2026-07-25 discovery capability gap analysis — six lenses, a duplicate/feasibility screen against 200 issues and nine roadmaps, two adversarial judge rankings, one completeness critique"
