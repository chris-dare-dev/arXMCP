items:
  - id: discovery-substrate-e1
    kind: epic
    title: "Span substrate and the first measured lexicon"
    summary: "One vertical slice from parsed HTML to a queryable epistemic-stance facet. Ships (a) ingest/sentences.py emitting a content-addressed sentences table (sentence_id over chunk_id + normalised text + ordinal, math-aware: never split inside <math>, inside a \\cite group, or on a closed abbreviation list); (b) ONE markers table shared by every future miner (match_id, sentence_id, lexicon_id, lexicon_version, class, cue_span, confidence, extractor_status); (c) the lexicon file format as committed YAML — id, version, classes, cue regexes, suppression guards, chunk-kind restriction; (d) tools/lexicon_audit.py, a stratified precision sampler emitting a dated record in the Accepted evidence-ledger 5-field census format; and (e) the boundary-markers lexicon itself plus the serving surface that makes it reachable. Vertical, not horizontal: the epic is not done until an agent asking an epistemic-stance question gets the sentence, and the precision behind it is a published number. This is the prerequisite nine separate proposals silently assumed; building it once turns eight downstream miners into data files and collapses ~500-900 scattered hand-adjudications into one sampler run per lexicon."
    priority: must
    size: L
    rice: { r: 8, i: 2, c: 0.5, e: 3, score: 2.67, rank: 2 }
    tags: [value, substrate, mining, D-negative-space]
    links:
      issue: ["https://github.com/chris-dare-dev/arXMCP/issues/211"]

  - id: discovery-substrate-e2
    kind: epic
    title: "The remaining miners, as data files"
    summary: "Once e1's substrate exists each additional signal is a versioned YAML lexicon plus one sampler run, not an engineering project. Four miners: global reductions carrying their hypothesis delta and dated resolution evidence (loop stages 2 and 4); a proof-technique facet so an agent can retrieve BY TECHNIQUE — specialization, deformation, degeneration to the boundary, p-adic reduction — rather than by topic; arXiv revision <comments> parsed into the source-truth revision registry as additive columns; and an attention queue that ranks every human-resolvable abstention by downstream unblock value, which only becomes meaningful once two miners are feeding it. Each miner carries its own measured precision before its view is exposed, and each abstains rather than guesses. The technique-vacancy view and the statement-level revision diff are both gated on a measured non-empty cell count rather than assumed."
    priority: should
    size: M
    rice: { r: 5, i: 2, c: 0.5, e: 2, score: 2.5, rank: 3 }
    depends_on: [discovery-substrate-e1]
    tags: [value, mining, D-negative-space]
    links:
      issue: ["https://github.com/chris-dare-dev/arXMCP/issues/212"]

  - id: discovery-substrate-e3
    kind: epic
    title: "Fidelity debt: serve what ingest already parsed"
    summary: "Three places where ingest already produced signal and serving discards it, independent of the mining substrate and startable in parallel. (a) The figure lane: 1,483 inline <svg> across 120 of 173 papers — class ltx_picture ltx_markedasmath, 262 of them literally inside <math> elements, i.e. TikZ/tikz-cd that LaTeXML itself classified as mathematics — plus 323 captioned floats, none of it reachable because `figure` sits in the chunker's non-recursed list (ingest/chunker.py:757) and grep for ltx_figure/ltx_graphics/tikz over ingest/ and server/ returns 0. In algebraic geometry a commutative diagram IS the content. (b) Notation consensus: 14,537 macros over 164 preamble.json files, 3,429 distinct symbols, 661 (19.3%) genuinely divergent after typographic normalisation — \\D spanning derived category / D-modules / the disc — while get_definitions requires a paper_id (server/handlers/definitions.py:68-69) so no cross-paper symbol question is expressible at all. (c) ascii_form, the executable rendering of the corpus's own equations, written as the empty string unconditionally at both call sites. Each of the three is scope-set by a Wave-0 measurement rather than assumed."
    priority: should
    size: M
    rice: { r: 5, i: 2, c: 0.5, e: 2.5, score: 2.0, rank: 4 }
    tags: [value, fidelity, D-modality]
    links:
      issue: ["https://github.com/chris-dare-dev/arXMCP/issues/213"]

  - id: discovery-substrate-e4
    kind: epic
    title: "The Lean refutation lane: compute a negative"
    summary: "arXMCP can prove and cannot disprove: lean_verify's mode enum is Literal['full','syntax_only','tactic_step'] (server/handlers/lean_verify.py:736) and no status token can mean 'this statement is false and here is the witness', while `plausible` — the counterexample finder — sits installed at the repl packages dir and unreachable. This epic adds a refutation mode returning a kernel-checked witness under its own status token, distinct from both proved and error and from operational failure; a directional definition probe (strictly-stronger / strictly-weaker / incomparable) as a mode of the same lane, attaching evidence to R5's human-owned faithfulness axis without setting it; and goal-directed search against a held proof state with an explicit exhaustiveness axis, so 'found nothing' and 'searched exhaustively and it is not there' never share a token. Gates externally on R3-m1 (honest per-axis statuses), R3-m2 (isolation, before agent-supplied long-running search is exposed) and R3-m5/m7 (a warm Mathlib-resident environment — the 30 s query timeout is shorter than a cold import Mathlib). Those are recorded as must-tier assumptions with validation, not scheduled away."
    priority: must
    size: L
    rice: { r: 4, i: 3, c: 0.5, e: 4, score: 1.5, rank: 5 }
    tags: [value, lean, refutation, D-falsify]
    links:
      issue: ["https://github.com/chris-dare-dev/arXMCP/issues/214"]

  - id: discovery-substrate-e5
    kind: epic
    title: "Formal-result hygiene: library identity and name resolution"
    summary: "Two small pieces of trust plumbing the refutation lane's output is only as good as. (a) Library identity on every Lean result: a grep for mathlib_rev / toolchain / lean_version across the 42 KB lean_verify handler returns 0, so a result today cannot be replayed, compared across time, or attributed to a library version — every Lean verdict is unpinned. (b) Pinned-Mathlib identifier resolution and deprecation repair, so an agent's reference to a declaration resolves against the environment actually in use rather than against the model's training-time memory of Mathlib, which is the dominant silent-failure mode in autoformalization. Deliberately NOT native Mathlib corpus ingestion — that is already adjudicated compose-don't-ingest (D2-R08, spike #186 unrun). Both are additive result fields and MUST ride the next batched TOOL_SCHEMA_VERSION re-pin window (agent-platform-e2 / W1) rather than minting their own, per the byte-stability discipline."
    priority: must
