items:
  - id: scale-ops-hardening-e1
    kind: epic
    title: "Linearize the bulk write path"
    summary: >
      Add a defer_indices mode to ingest/store.write_chunks used by bulk_ingest,
      oai_delta, re_embed, and the notebook drivers: skip per-paper
      _create_indices, build/merge indices once at end-of-run (or every K~500
      papers) via LanceDB's incremental optimize() instead of a full
      create_index(replace=True) retrain on both embedding columns; extend
      cutover criteria to verify index presence on staging before promote.
      Replace _count_non_null's and the marker paper-count's full-table
      to_arrow() materializations with a projected count_rows(predicate) plus
      a caller-maintained running set rebuilt from the committed table on
      crash-resume. Per-write behavior for single-paper UI ingests is
      unchanged; the post-index version-pinning contract is preserved. This is
      the single blocker D5-R01 names as capping the corpus at ~10^3-10^4
      papers regardless of anything else in this roadmap.
    priority: must
    size: M
    rice: { r: 30, i: 3, c: 0.8, e: 2.5, score: 28.8, rank: 1 }
    tags: [value, storage, ingest, write-path, D5-R01, D1-R02]
    links:
      code:
        - "ingest/store.py"
        - "ingest/bulk_ingest.py"
        - "ingest/oai_delta.py"
        - "ingest/re_embed.py"

