schema: roadmap/1
slug: scale-ops-hardening
project: arxmcp
title: "arXMCP scale, ops & content-security hardening"
status: active
phase: complete          # init -> refined -> decomposed -> sequenced -> complete
brief: |
  arXMCP targets a 200K-paper corpus, but a triple-quadratic LanceDB write path, zero scheduled index optimize/cleanup, and a BM25 lane that blocks startup readiness for zero served traffic stand between today's roughly 125 papers and that goal, all invisible at notebook scale and lethal by 1K to 10K papers. This initiative makes growth a decision instead of a discovery: linearize the bulk write path, schedule pin-aware version maintenance, decouple BM25 from readiness, land a scale-guard telemetry pack whose gauges trigger every other guard with documented inflection thresholds, add GPU-capable ingest, and validate at an instrumented 10K-paper dump-sourced capacity checkpoint that gates Tier-5 entry, with staying at notebook scale documented as a legitimate outcome. It also hardens the untrusted-content pipeline: contain the MinerU/PDF parser (a live critical CVE class) and the Windows LaTeXML path, and screen ingested papers for hidden-instruction injection at the one point poison can be removed rather than fenced. Corpus sizing must be recomputed on measured chunks-per-paper before thresholds are set (the analysis's raw sizing was inflated). Capacity and recall benchmarks depend on the evidence-engine track and the write-path fix landing first. Verify the cron/systemd nightly ops actually run on the Windows tier-1 host, and add a wheel-build/test CI check. Do not build a bespoke synthetic 10K load harness or add ONNX int8 CPU inference.
horizon: { start: 2026-07-07, end: 2026-09-25 }
goal:
  hmw: "How might we linearize arXMCP's bulk write path, land scale-guard telemetry with documented inflection thresholds, and contain/screen the untrusted-content ingest pipeline so that arXMCP's solo operator can decide - with measured evidence instead of a mid-backfill surprise - whether and when to grow the corpus from today's ~125 papers toward the 200K target, or to deliberately hold at notebook scale?"
  objective: "Ship a linearized bulk write path, scale-guard telemetry with documented inflection thresholds, GPU-capable ingest, and a contained, poison-screened ingest pipeline - validated by an instrumented 10K-paper capacity checkpoint that gates Tier-5 entry."
  key_results:
    - "A bulk/batch ingest run (bulk_ingest, oai_delta, re_embed, notebook drivers) produces exactly one end-of-run index build instead of one per-paper rebuild, verified by an MVCC version-count assertion in a batch-ingest test"
    - "The daily ops report and /status surface all ~8 scale-guard gauges (lancedb version_count, dir_bytes, BM25 bytes, startup seconds, notebook count, backup duration/bytes, per-stage ingest throughput) with D5-R07's inflection table encoded as documented thresholds"
    - "/readyz returns 200 with ARXMCP_BM25_PHASE=off as the default even when the BM25 pickle load path is forced to fail, verified by a startup test"
    - "An ingest-time hidden-instruction screening pass records a persisted verdict for 100% of ingested papers (warn-only, 0 silent drops), and MinerU/uploaded-PDF parsing runs inside a no-egress container on the Windows host with a documented Docker-unavailable fallback"
    - "An instrumented, abortable 10K-paper capacity checkpoint publishes .claude/docs/capacity-model.md with measured sec/paper, startup-seconds, and version-growth curves, and 'capacity model green at 10K' becomes a required Tier-5 entry criterion in .claude/TIER-GATES.md alongside the existing drift gate"
    - "All 6 documented nightly cron/systemd ops jobs are confirmed executing on the Windows tier-1 host (or ported where found inert), and a wheel-build + test CI check runs on every push (today: 0 CI workflows exist in the repo)"
  assumptions:
    - tier: must
      text: "The gap analysis's raw 200K sizing (~12M chunks, ~98 GB) is inflated; the corrected basis is ~25 chunks/paper (~5M chunks, ~20 GB fp32, one populated embedding column per chunk) per cross-synthesis ruling C2 - but even that is unmeasured against this corpus's actual chunk/paper ratio"
      validation: "Before any D5-R07 gauge threshold or D5-R15 checkpoint criterion is pinned to a number, measure actual chunks-per-paper on the live 125-paper Bridgeland notebook and recompute the ~500/1K/2-5K/10K/15-30K/50-100K inflection points in D5.md's table against the measured value, not the analysis's inflated figure"
    - tier: must
