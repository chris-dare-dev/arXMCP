<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><title>Two equations fixture</title></head>
<body>
<article class="ltx_document">
  <section class="ltx_section" id="S1">
    <h2 class="ltx_title ltx_title_section">1. Integrals and series</h2>

    <div class="ltx_theorem ltx_theorem_theorem" id="S1.Thmtheorem1">
      <h6 class="ltx_title ltx_runin ltx_font_bold ltx_title_theorem">Theorem 1.1.</h6>
      <div class="ltx_para">
        <p class="ltx_p">Let g be a continuous function on the closed interval. Then the integral below exists and is finite.</p>
        <table class="ltx_equation ltx_eqn_table" id="S1.E1">
          <tbody><tr class="ltx_equation ltx_eqn_row"><td class="ltx_eqn_cell">
            <math alttext="\int_{a}^{b}g(t)\,dt" class="ltx_Math" display="block"><mrow><msubsup><mo>&#x222B;</mo><mi>a</mi><mi>b</mi></msubsup><mrow><mi>g</mi><mo>(</mo><mi>t</mi><mo>)</mo></mrow><mi>d</mi><mi>t</mi></mrow></math>
          </td></tr></tbody>
        </table>
      </div>
    </div>

    <div class="ltx_theorem ltx_theorem_theorem" id="S1.Thmtheorem2">
      <h6 class="ltx_title ltx_runin ltx_font_bold ltx_title_theorem">Theorem 1.2.</h6>
      <div class="ltx_para">
        <p class="ltx_p">Let the coefficients be absolutely summable. Then the series below converges to a finite limit.</p>
        <table class="ltx_equation ltx_eqn_table" id="S1.E2">
          <tbody><tr class="ltx_equation ltx_eqn_row"><td class="ltx_eqn_cell">
            <math alttext="\sum_{n=0}^{\infty}a_{n}" class="ltx_Math" display="block"><mrow><munderover><mo>&#x2211;</mo><mrow><mi>n</mi><mo>=</mo><mn>0</mn></mrow><mi>&#x221E;</mi></munderover><msub><mi>a</mi><mi>n</mi></msub></mrow></math>
          </td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</article>
</body>
</html>
