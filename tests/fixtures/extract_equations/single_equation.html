<!DOCTYPE html>
<html>
<head><title>Single equation fixture</title></head>
<body>
<div class="ltx_para">
<p class="ltx_p">The Euler identity is famous because it links five fundamental constants in a single equation.</p>
<table class="ltx_equation ltx_eqn_table" id="S0.E1">
  <tbody>
    <tr class="ltx_equation ltx_eqn_row ltx_align_baseline">
      <td class="ltx_eqn_cell ltx_align_center">
        <math alttext="e^{i\pi}+1=0" class="ltx_Math" display="block" id="S0.E1.m1">
          <mrow>
            <msup><mi>e</mi><mrow><mi>i</mi><mi>&#x3C0;</mi></mrow></msup>
            <mo>+</mo>
            <mn>1</mn>
            <mo>=</mo>
            <mn>0</mn>
          </mrow>
        </math>
      </td>
      <td class="ltx_eqn_cell ltx_eqn_eqno">
        <span class="ltx_tag ltx_tag_equation">(1)</span>
      </td>
    </tr>
  </tbody>
</table>
</div>
</body>
</html>
