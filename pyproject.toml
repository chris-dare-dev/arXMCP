[project]
name = "arxmcp"
version = "0.1.0"
description = "Local-first MCP server exposing a research-mathematics arXiv corpus to multi-agent Claude pipelines"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # beautifulsoup4: HTML5 parse-tree walker for LaTeXML output (no C deps;
    #   uses html.parser backend bundled with Python). Added for E02_S01.
    "beautifulsoup4>=4.12",
    # transformers: BGE-M3 tokenizer for token-budget enforcement in the
    #   chunker. Loads tokenizer vocab only (~5 MB cached); NOT full model
    #   weights, so torch is NOT required. Added for E02_S01.
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".claude",
    "var",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
