[build-system]
# Closes F5+IS1 from the E06_S01 critique. Without an explicit
# build-system + tool.setuptools.packages declaration, setuptools'
# auto-discovery refuses to build because the flat layout has
# >1 top-level dir (var/, shim/, infra/, docker/, ingest/, server/,
# tests/, tools/). The ``pip install -e .`` in docker/Dockerfile.server
# AND in ``make bootstrap`` would both fail without this.
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Scoped discovery over the six package trees. The ``*`` globs are
# load-bearing: a bare list of top-level names (server, ingest, tools, shim)
# OMITS subpackages — server.handlers, server.routes, tools.security, etc. —
# so a built wheel raises ModuleNotFoundError at runtime (e.g. the container
# crash on ``from tools.security.pdfid import ...``). Scoping the include to
# these patterns still avoids the "multiple top-level packages discovered
# in a flat-layout" error that an unscoped find would raise on var/, infra/,
# docker/. ``shim`` (E06_S02) carries the arxmcp-shim console-script below.
#
# ``ops*`` (issue #206) and ``frontend*`` (issue #195 / trustworthy-release-m4)
# were BOTH absent until 2026-07-31. The consequence was silent: a wheel-
# installed operator got no backup, no cutover, no restore drill and no drift
# watchdog, and ``create_app()`` crashed on the missing
# ``frontend/static`` StaticFiles directory. ``ops`` is a real package
# (``ops/__init__.py``); ``ops.cron`` / ``ops.systemd`` / ``frontend.*`` are
# implicit-namespace dirs picked up because ``namespaces`` defaults to true
# — they carry no ``.py`` at all and exist purely to anchor the
# ``package-data`` globs below.
#
# ``frontend`` is deliberately TOP-LEVEL rather than ``server.frontend``:
# both call sites resolve it relative to the ``server`` package's parent
# (``server/routes/ui.py:77`` ``parents[2]`` and ``server/main.py:802``
# ``parent.parent``), which lands on site-packages/ in a wheel install and on
# the repo root in a source checkout — one path expression, both layouts, no
# runtime change. This matches trustworthy-release-m4's acceptance verbatim
# ("frontend/templates/*.html and frontend/static/* are present"). It does
# claim a generic top-level name in site-packages; re-siting it under
# ``server/`` is a follow-up to weigh before the first PyPI publish.
include = ["server*", "ingest*", "tools*", "shim*", "ops*", "frontend*"]

[tool.setuptools.package-data]
# NON-``.py`` FILES ARE NOT PACKAGED WITHOUT AN EXPLICIT GLOB. Declaring a
# directory in ``packages.find`` above ships only its modules; every data
# file needs a line here. Three of these were missing entirely until
# 2026-07-31 and the failure mode was a hard crash, not a warning:
#
#   * ``server/router_patterns.yaml`` — ``server/router.py:261`` RAISES
#     ("router_patterns.yaml missing at ...") when absent, so the wheel
#     built before this section could not boot at all.
#   * ``server/schemas/*.json`` — the declared source of truth for the
#     ``search_papers`` / ``lean_verify`` result rows (``server/tools.py:103``).
#   * ``tools/seed-papers.txt`` — read at ``tools/fetch_seed.py:55``.
#
# ``tests/test_wheel_packaging.py`` walks the shipped trees on disk and
# fails if any non-``.py`` file is not matched by a glob here, so a future
# data file cannot silently drop out of the wheel the same way.
"server" = ["router_patterns.yaml"]
"server.schemas" = ["*.json"]
"ingest" = ["*.sh"]
"tools" = ["*.sh", "seed-papers.txt"]
# ops/: the operability layer (issue #206) — backup, cutover, restore drill,
# drift watchdog. The ``.sh`` / ``.cron`` / ``.service`` / ``.timer`` files
# are the halves an operator actually invokes; shipping only the ``.py``
# modules would leave the runbooks in docs/ops/ pointing at absent files.
"ops" = ["*.sh", "*.template"]
"ops.cron" = ["*.sh", "*.cron"]
"ops.systemd" = ["*.service", "*.timer"]
# frontend/: operator-console assets. NOT a Python package — data only.
"frontend.templates" = ["*.html"]
"frontend.static" = ["*.css", "*.js", "*.svg", "*.md"]

[project.scripts]
# E06_S02 stdio shim. Installed on $PATH by ``pip install -e .`` /
# ``pipx install arxmcp``. Claude Code's ``~/.claude.json`` registers
# this command name verbatim; renaming would force every operator to
# update their MCP server registration.
arxmcp-shim = "shim.arxmcp_shim:main"
# The long-running server (issue #206). ``docs/install.md`` has instructed
# operators to verify their install with ``arxmcp-server --help`` since the
# doc was written, but no ``[project.scripts]`` section existed at all — the
# first verification step a new operator runs failed immediately.
#
# Points at ``server.cli``, NOT ``server.main``: importing ``server.main``
# executes ``create_app()`` at module scope (``server/main.py:890``), so
# hanging the console script off it would build the entire FastAPI app —
# LanceDB handles, MCP mount, StaticFiles — just to print ``--help``, and
# would exit non-zero on any config error before argparse ever ran.
# ``server/cli.py`` imports ``server.main`` lazily, inside ``main()``.
arxmcp-server = "server.cli:main"

[project]
name = "arxmcp"
version = "0.1.0"
description = "Local-first MCP server exposing a research-mathematics arXiv corpus to multi-agent Claude pipelines"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    # beautifulsoup4: HTML5 parse-tree walker for LaTeXML output (no C deps;
    #   uses html.parser backend bundled with Python). Added for E02_S01.
    "beautifulsoup4>=4.12",
    # transformers: BGE-M3 tokenizer (E02_S01) AND model loader (E03_S01).
    #   The chunker uses tokenizer-only paths; the embedder loads the full
    #   model weights via ``transformers.AutoModel.from_pretrained``.
    "transformers>=4.40",
    # torch: BGE-M3 forward pass for the dual-column embedder (E03_S01).
    #   CPU inference is the default; GPU acceleration is an E11 concern.
    #   Standard PyPI ``torch`` is fine for CPU and pulls ~1.5 GB of wheels;
    #   a future infra ticket may switch to the CPU-specific extra-index URL
    #   ``--extra-index-url https://download.pytorch.org/whl/cpu`` to drop
    #   CUDA wheels.
    #   Capped below 3.0 (issue #206): a torch major bump is the single
    #   likeliest way for a fresh install to land on an ABI that
    #   ``transformers``' BGE-M3 loader cannot use, and the failure would
    #   surface as an embedder crash at ``Resources.startup`` — after the
    #   operator has already downloaded ~2 GB. Bumping the cap is a
    #   deliberate act with an eval re-run, not a resolver's choice.
    "torch>=2.0,<3",
    # safetensors: Threat 6 (08-security-observability-ops.md) requires the
    #   safetensors weight format and refuses ``.bin`` / pickle files. The
    #   ``transformers`` model loader picks safetensors automatically when
    #   this dependency is installed and the repo ships safetensors files.
    "safetensors>=0.4",
    # numpy: NPZ-store backing for the per-paper embedding vectors written
    #   by ``ingest/embedder.py``. Read by E04_S01's ``ingest/store.py``
    #   when assembling LanceDB rows.
    "numpy>=1.24",
    # lancedb: vector store for the chunks table (E04_S01). Embedded
    #   storage under ``var/arxmcp/index/lancedb/``; native MVCC + HNSW
    #   index support. PyArrow-backed schema discipline.
    #   On-disk format pin (notebook-ops-hardening-m2): every
    #   ``db.create_table`` passes
    #   ``storage_options={"new_table_data_storage_version": "stable"}``
    #   (see ``ingest.schema.LANCE_STORAGE_OPTIONS``) so a version bump
    #   here can't silently migrate the on-disk format under a pinned
    #   reader. The upper bound is intentionally NOT tightened yet — add
    #   ``<0.31`` only if a real format regression is observed.
    #
    #   FLOOR CORRECTED 2026-07-31 (issue #206): it was ``>=0.6``, which the
    #   code cannot actually run against. ``ingest/schema.py:112`` documents
    #   that the modern kwarg is
    #   ``storage_options={"new_table_data_storage_version": "stable"}`` and
    #   that the older bare ``data_storage_version="stable"`` was accepted
    #   and SILENTLY DROPPED — a resolver picking any 0.6..0.29 release
    #   would therefore write tables in an unpinned on-disk format while
    #   every comment in the tree claims the format is pinned. The floor now
    #   names the release whose behavior that comment was verified against.
    #   The upper bound stays open per the recorded decision above.
    "lancedb>=0.30.2",
    # pyarrow: schema definition for the LanceDB ``chunks`` table
    #   (E04_S01). The single source of truth for all downstream readers
    #   lives in ``ingest/schema.py`` as a ``pa.schema(...)`` object.
    #   Floor raised 16.0 and capped below 25 (issue #206): the schema
    #   object is the contract between ingest and every reader, and pyarrow
    #   has removed deprecated schema//type APIs at major boundaries before.
    #   An unbounded range let a resolver pair a new pyarrow with the pinned
    #   lancedb above, which is the combination least likely to have been
    #   exercised. 16.0 is the oldest release still receiving fixes when this
    #   floor was set.
    "pyarrow>=16.0,<25",
    # rank-bm25: pure-Python BM25 index (E04_S04). MIT-licensed, no
    #   compiled deps, ~400 LOC. Closes H4 (no Tantivy LaTeX analyzer
    #   fiction); BM25 indexes the pre-tokenized ``body_tokens`` field
    #   produced by E02_S03's regex tokenizer. Pickle-serialized index
    #   is an in-process Tier-0 optimization; Tier-5 needs a scalable
    #   replacement (E11).
    "rank-bm25>=0.2",
    # mcp: Model Context Protocol Python SDK (E06_S01). Provides
    #   ``FastMCP`` and ``streamable_http_app()`` for the MCP
    #   2025-06-18 spec's mandated Streamable HTTP transport. Pinned
    #   to a tested minor because the 1.x line has had attribute
    #   renames (``sse_app`` → ``streamable_http_app``); a future
    #   bump is a one-line change inside ``server/_mcp_mount.py``.
    "mcp>=1.27,<2",
    # fastapi: ASGI framework for the long-running ``arxmcp-server``
    #   (E06_S01). 0.115+ is the modern lifespan-context-manager API
    #   (``@app.on_event`` is deprecated and is NOT used).
    "fastapi>=0.115",
    # uvicorn[standard]: ASGI server runner. ``[standard]`` pulls
    #   ``uvloop`` + ``httptools`` for the C-accelerated event loop
    #   path. Single-worker by design — multi-worker would defeat
    #   shared-cache semantics (the same trap as stdio MCP).
    "uvicorn[standard]>=0.30",
    # pydantic-settings: env-var loading for ``ARXMCP_*`` config.
    #   Field-level validators reject ``ARXMCP_BIND_HOST=0.0.0.0``
    #   at config parse time, satisfying E06_S01's loopback AC.
    "pydantic-settings>=2.4",
    # prometheus-client: ``/metrics`` exposition (E06_S01). Default
    #   single-process registry; multiprocess mode is explicitly NOT
    #   used (the server is single-process by design).
    "prometheus-client>=0.20",
    # PyYAML: parser for ``server/router_patterns.yaml`` (E08_S01).
    #   Loaded via ``yaml.safe_load`` only (CVE-2017-18342 — never
    #   ``yaml.load`` without a Loader). Already a transitive dep
    #   via transformers / lancedb; declared explicitly to match
    #   the project's "no implicit deps" discipline.
    "pyyaml>=6.0",
    # jinja2: server-side HTML templating for the per-notebook UI
    #   (proof-verify-handler-wiring-m8). Used via
    #   ``fastapi.templating.Jinja2Templates`` from
    #   ``server/routes/ui.py`` with ``autoescape=True`` (explicit;
    #   the Starlette default ``select_autoescape()`` enables the
    #   same protection but explicit > implicit). Already a transitive
    #   dep via mcp (>=1.27.1); declared explicitly to match the
    #   project's "no implicit deps" discipline. Pinned >=3.1.3 to
    #   close CVE-2024-22195 (xmlattr XSS). License: BSD-3-Clause.
    "jinja2>=3.1.3",
    # python-multipart: multipart/form-data parser for the m8 ar5iv
    #   HTML upload endpoint (``UploadFile`` requires it; without
    #   the dep FastAPI raises ImportError at request time). Already
    #   a transitive dep via mcp; declared explicitly. Pinned
    #   >=0.0.18 to close CVE-2024-53981 (DoS via crafted multipart).
    #   License: Apache-2.0.
    "python-multipart>=0.0.18",
    # faiss-cpu: in-process flat ANN index for the Tier-2 semantic-
    #   query cache (E08_S03). ``IndexFlatIP`` over L2-normalized
    #   BGE-M3 vectors yields cosine via inner product. ~1000-entry
    #   ring buffer @ dim=1024 fits in ~4 MB of memory; sub-millisecond
    #   search time. CPU-only; the project's local-first deployment
    #   does not depend on a GPU runtime. License: MIT.
    "faiss-cpu>=1.7",
    # kuzu: embedded graph database for the citation graph (E09_S01).
    #   Pinned EXACTLY to 0.11.3 (the final stable release) because the
    #   upstream project was archived on 2025-10-10. License: MIT. A
    #   future fork migration (Kineviz bighorn / Vela-Engineering) is
    #   tracked separately; do not bump this pin without re-evaluating.
    "kuzu==0.11.3",
    # defusedxml: XXE/billion-laughs-safe replacement for
    #   ``xml.etree.ElementTree`` (E10_S03). Used by
    #   ``server.retrieval.equations`` to parse MathML from caller input
    #   to the find_equation handler. Pure-Python stdlib drop-in;
    #   defense-in-depth for the per-handler max_length=4000 cap.
    #   License: Python Software Foundation License (PSF) 2.0, on the
    #   project's allow-list (BSD-style).
    "defusedxml>=0.7",
    # zss: Zhang-Shasha tree-edit distance over MathML parse trees
    #   (E10_S03). Pure Python, no compiled deps. Last release 2018-03-12
    #   (maintenance-frozen but stable — the algorithm is closed-form and
    #   the project's use is narrow). Used in ingest.index_equations (build
    #   time) and server.retrieval.equations (query time). License:
    #   BSD-3-Clause (verified from the LICENSE bundled in the wheel; the
    #   PyPI metadata does not surface this — both research briefs
    #   reported MIT but the actual bundled license is BSD-3-Clause,
    #   which sits on the same allow-list as MIT for this project). A
    #   compiled replacement (APTED via a C extension) is a future
    #   optimization tracked under E10_S03 follow-ups.
    "zss>=1.2.0",
    # latex2mathml: pure-Python LaTeX -> Presentation-MathML converter
    #   (retrieval-unlocks-m4). Lets find_equation route a LaTeX query
    #   onto the TED lane instead of the dense-only fallback, WITHOUT a
    #   query-time LaTeXML (Perl) subprocess — that heavier escape hatch
    #   stays the documented alternative if parity proves insufficient.
    #   Pinned EXACTLY: the converter's output tree shape is the input to
    #   a distance metric, so a minor-version change to its <mrow>
    #   grouping would silently move every equation score. Treat a bump
    #   as an eval event — re-run tests/eval/test_equations_parity.py.
    #   NOTE it does NOT expand \newcommand macros (LaTeXML did, at
    #   ingest), which is the main source of query-vs-corpus divergence
    #   and is what the parity gate measures. License: MIT.
    "latex2mathml==3.81.0",
    # opentelemetry-{api,sdk,exporter-otlp-proto-grpc}: distributed-tracing
    #   surface for E14_S02 (one parent span per JSON-RPC tool call; child
    #   spans for embed / rerank / ANN). Pinned to the 1.x line — API has
    #   been ABI-stable since 1.0; 1.41+ has the stable GenAI bindings.
    #   The OTLP/gRPC exporter alone is intentional — the umbrella
    #   ``opentelemetry-exporter-otlp`` would also pull the HTTP exporter
    #   we don't use (grpcio alone is ~5 MB; the HTTP variant adds more).
    #   When ``ARXMCP_OTEL_ENDPOINT`` is unset, the SDK is never
    #   ``set_tracer_provider``-installed, and every
    #   ``tracer.start_as_current_span(...)`` takes the ProxyTracer no-op
    #   fast path with zero allocation. License: Apache-2.0.
    "opentelemetry-api>=1.41,<2",
    "opentelemetry-sdk>=1.41,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41,<2",
    # scipy: Hungarian-assignment solver (``scipy.optimize.linear_sum_assignment``)
    #   for the CDM (Character Detection Matching) parser-fidelity eval gate
    #   (parser-fidelity-eval-m1). BSD-3-Clause, on arXMCP's permissive-license
    #   allow-list. ~50 MB install footprint. Specifically chosen over OpenCV's
    #   matching utilities because OpenCV's Intel MKL/OpenMP runtime collides
    #   with PyTorch's OpenMP under faiss-cpu on macOS (CLAUDE.md §8 gotcha 1
    #   KMP_DUPLICATE_LIB_OK segfault landmine). scipy ships its own minimal
    #   linear-algebra path with no OpenMP conflict. See research-synthesis
    #   §D1 for the full rationale.
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.0",
]
# textbook-ingest e2 — PDF parsing via MinerU 3.x is INTENTIONALLY NOT
# in a project extra. MinerU's dep tree caps transformers at v4, which
# would silently downgrade the BGE-M3 / BGE-reranker stack the project
# ships against (textbook-ingest-m5 F1 finding). Operators install
# MinerU into a SEPARATE venv (~/venvs/mineru/) and point the m5
# driver at the binary via ARXMCP_MINERU_BIN. Project tests use
# `requires_mineru` marker + opt-in env var; project venv never
# imports the mineru package directly.
# See docs/install.md for the install procedure.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    ".claude",
    "var",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "requires_model: tests that download / load a real ML model (BGE-M3, BGE-reranker-v2-m3, etc.). Skipped by default in CI; opt-in via `pytest -m requires_model` AND the per-model env-var (e.g. ARXMCP_RUN_REAL_BGE_RERANKER=1).",
    "eval: end-to-end retrieval-quality eval against the curated 20-query fixture (E05_S02 / E07_S04). Tier-1 → Tier-2 exit gate. Skipped via the cold-start matrix when fixture or corpus is missing; opt-out via `pytest -m \"not eval\"`.",
    "requires_latexmlc: tests that invoke the real `latexmlc` binary (E10_S04 drift detector integration tests). Skipped by default; opt-in via `pytest -m requires_latexmlc`. Requires LaTeXML installed locally (`brew install latexml` / `apt install latexml`).",
    "requires_full_corpus: tests that assert against a fully-ingested 200K-paper corpus (E11_S01 sanity tests). Skipped by default; opt-in via `pytest -m requires_full_corpus` AND `ARXMCP_RUN_FULL_CORPUS_TESTS=1`. Pre-condition: operator has run `make ingest` end-to-end and the staging LanceDB has ≥ 100K chunks.",
    "requires_lean_repl: tests that invoke the real Lean 4 REPL subprocess (verification-feedback-m2+). Skipped by default; opt-in by setting BOTH ARXMCP_LAKE_PATH (absolute path to the lake binary) and ARXMCP_LEAN_REPL_DIR (a built leanprover-community/repl directory). Lean is a system dependency, not a pip dep — see .claude/notes/spikes/verification-feedback-spike-2.md.",
    "requires_pdflatex: tests that invoke the real `pdflatex` + `pdftoppm` binaries (parser-fidelity-eval-m1 CDM gate). Skipped by default; opt-in via `pytest -m requires_pdflatex` AND `ARXMCP_RUN_REAL_PDFLATEX=1`. Requires pdflatex (part of texlive: `brew install --cask mactex-no-gui` / `apt install texlive-base`) and pdftoppm (part of poppler-utils: `brew install poppler` / `apt install poppler-utils`) installed locally. Subprocess sandbox follows the same `start_new_session=True` + `os.killpg` discipline as LaTeXML per `.claude/docs/security-cdm-sandbox.md`.",
    "requires_mineru: tests that invoke the real `mineru` binary (textbook-ingest-m5 PDF parser subprocess driver). Skipped by default; opt-in via `pytest -m requires_mineru` AND `ARXMCP_RUN_REAL_MINERU=1` AND `ARXMCP_MINERU_BIN` set to the absolute path of the mineru binary (typically `~/venvs/mineru/bin/mineru` — install via `uv venv ~/venvs/mineru && uv pip install --python ~/venvs/mineru/bin/python 'mineru[pipeline,mlx]'`). Subprocess sandbox profile is documented at `.claude/docs/security-pdf-sandbox.md`. RLIMIT_AS 4 GB cap is Linux-only — macOS does NOT enforce (verified live test); wall timeout is the only memory backstop on Darwin.",
    "requires_wheel_build: tests that build the project wheel and install it into a throwaway virtualenv (issue #206 / trustworthy-release-m4 clean-environment install check). Skipped by default; opt-in via `pytest -m requires_wheel_build`, or run the underlying script directly with `make wheel-check`. The `contents` half needs only `uv` (or `build`) on PATH and no network; the `full` half ALSO requires `ARXMCP_RUN_FULL_WHEEL_CHECK=1` and resolves the real ~2 GB dependency set before booting the server with ARXMCP_BOOTSTRAP_MODE=1 and polling /healthz. docs/releasing.md makes the full run a pre-publish gate.",
    "requires_restic: tests that invoke the real `restic` binary (notebook-ops-hardening-m1 backup round-trip). Skipped by default; opt-in via `pytest -m requires_restic` AND `ARXMCP_RUN_RESTIC_TESTS=1`. Requires restic >= 0.16 installed locally (`brew install restic` / `apt install restic`). The test inits a throwaway repo under tmp_path with RESTIC_PASSWORD=test and does a backup->wipe->restore->sha256 byte-equality round-trip of a synthetic notebook (uploaded PDF + notebooks.db row).",
]
