[workspace]
members = [
    "crates/desktop-contract",
    "crates/fixture-sidecar",
    "crates/supervisor",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
fs2 = "=0.4.3"
getrandom = "=0.3.4"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = "=2.11.5"
tauri-build = "=2.6.3"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
