[workspace]
members = [
    "crates/desktop-contract",
    "crates/fixture-sidecar",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
getrandom = "=0.3.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
