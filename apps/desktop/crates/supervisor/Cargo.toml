[package]
name = "arxmcp-desktop-supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
arxmcp-desktop-contract = { path = "../desktop-contract" }
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# webview-data-url: the two-state render starts on an inline data: page
# before navigating to the child's /ui/ console.
tauri = { workspace = true, features = ["webview-data-url"] }
tauri-plugin-single-instance.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
tauri-build.workspace = true

[[bin]]
name = "supervisor"
path = "src/main.rs"
