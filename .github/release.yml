# Configuration for GitHub's auto-generated release notes.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
#
# Paste the matching CHANGES.md section above the auto-generated list as the
# human summary; this file just categorizes the commit/PR list below it.
changelog:
  categories:
    - title: ✨ Features
      labels:
        - feature
        - enhancement
    - title: 🛠 Fixes & rectifications
      labels:
        - bug
        - fix
        - rect
    - title: 🔒 Security
      labels:
        - security
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 🔧 Maintenance
      labels:
        - chore
        - infra
        - dependencies
    - title: Other changes
      labels:
        - "*"
