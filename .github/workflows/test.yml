name: test

# Invariant: `make test` (ruff, then the default pytest suite) passes on a
# clean Linux runner under every Python the project runs on: 3.11 is the
# server container's base image and the declared floor, 3.12 is what the
# desktop bundle freezes, and 3.13 is the development interpreter.
#
# The default suite skips every opt-in marker (tests/conftest.py), so the job
# needs no models, corpus, LaTeXML, Lean or desktop toolchain. Torch installs
# from PyPI exactly as locked, CUDA wheels included (a 5 GB environment). The
# ops shell scripts call the runner's own python3, standard library only, as
# they do under cron; an image without one fails their tests.

on:
  pull_request:
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  make-test:
    name: make test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.17"
          enable-cache: true

      - name: install the locked environment
        run: uv sync --locked --python ${{ matrix.python }}

      - name: make test
        run: make test PYTHON=.venv/bin/python
