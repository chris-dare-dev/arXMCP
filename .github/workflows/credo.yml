name: credo

# Invariant: every tracked Markdown file is on the allow-list in CREDO.md
# ("In this repository").
#
# Not path-filtered: every change is judged. It reads git metadata only, with
# the runner's own python3, and installs and tests nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  prose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: markdown stays on the allow-list
        run: python3 .github/credo_prose.py
